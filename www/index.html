<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NOCTALIS — L'Éveil des Ombres</title>
<style>
:root{--v:#8b5cf6;--v2:#c26bff;--g:#ffcc33;--b:#38bdf8;--bg:#0b0820;--t:#fff;--st:0 0 2px #000,0 2px 0 #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05040d;color:#fff;font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
b{font-weight:900}
svg{width:1em;height:1em;fill:currentColor;vertical-align:-.15em}
.ii{width:1.05em;height:1.05em;margin-left:2px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#labels,#dmgs,#toasts,#banner,#flash,#fade,#zt,#bars,#army,#joy{pointer-events:none!important}

/* carte joueur + monnaies */
#pcard{position:absolute;left:calc(10px + env(safe-area-inset-left));top:8px;display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:30px;background:linear-gradient(90deg,rgba(40,20,90,.9),rgba(20,10,50,.5));border:2px solid rgba(194,107,255,.6);box-shadow:0 0 14px rgba(139,92,246,.45)}
#plvl{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:17px;background:radial-gradient(circle at 35% 30%,#d8b4fe,#6d28d9 60%,#2e1065);border:2px solid #f5d0fe;text-shadow:var(--st)}
#pname{font-weight:900;font-size:13px;text-shadow:var(--st);letter-spacing:.5px}
#ppow{font-size:11px;color:#e9d5ff;text-shadow:var(--st)} #ppow b{color:var(--g)}
#cur{position:absolute;left:calc(10px + env(safe-area-inset-left));top:58px;display:flex;gap:5px;flex-wrap:wrap;max-width:46vw}
#cur span{display:flex;align-items:center;gap:4px;padding:2px 9px 2px 4px;border-radius:14px;background:rgba(10,6,28,.75);border:1px solid rgba(255,255,255,.14);font-size:13px;text-shadow:var(--st)}
#cur .ci{width:18px;height:18px}

/* dock */
#dock{position:absolute;left:calc(8px + env(safe-area-inset-left));top:92px;display:grid;grid-template-columns:repeat(3,54px);gap:5px}
.dk[data-id=domaine]{background:linear-gradient(160deg,#a16207,#3b0764);border-color:#fcd34d}
.dk{position:relative;width:54px;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;
 background:linear-gradient(160deg,#3b1d8f,#160a3d);border:2px solid #7c5cff;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 #0a0420,0 0 10px rgba(124,92,255,.4);transition:transform .08s}
.dk:active{transform:scale(.9)}
.dk svg{width:24px;height:24px;color:#e9d5ff;filter:drop-shadow(0 2px 0 #000)}
.dk span{font-size:9.5px;font-weight:900;text-shadow:var(--st);letter-spacing:.2px}
.dk .dot{position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:#ff3355;border:2px solid #fff;box-shadow:0 0 8px #ff3355;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}

/* titre de zone */
#zt{position:absolute;left:50%;top:16%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .6s}
#zt.show{opacity:1}
#ztn{font-size:34px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#fff;text-shadow:var(--st),0 0 18px #8b5cf6,0 0 36px #7c3aed}
#zts{font-size:13px;letter-spacing:6px;color:#e9d5ff;text-transform:uppercase;text-shadow:var(--st)}

/* HUD donjon */
#dhud{position:absolute;left:50%;top:8px;transform:translateX(-50%);min-width:360px;padding:8px 14px;border-radius:12px;background:linear-gradient(180deg,rgba(18,30,90,.92),rgba(10,10,40,.88));border:2px solid #38bdf8;box-shadow:0 0 18px rgba(56,189,248,.55),inset 0 0 20px rgba(56,189,248,.2)}
.dh-top{display:flex;align-items:center;gap:12px}
#dhicon svg{width:40px;height:40px;color:#7dd3fc;filter:drop-shadow(0 0 6px #38bdf8)}
#dhk{font-size:12px;color:#bae6fd;font-weight:700}
#dhr{font-size:24px;font-weight:900;text-shadow:var(--st)}
#dht{margin-left:auto;text-align:center}#dht small{display:block;font-size:11px;color:#7dd3fc;font-weight:900;letter-spacing:2px}#dht b{font-size:26px;text-shadow:var(--st)}#dht.low b{color:#ff3355;animation:pulse .5s infinite}
#dhl{text-align:center;font-size:14px;font-weight:900;margin-top:4px;text-shadow:var(--st)}
.bar{height:8px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:3px;border:1px solid rgba(255,255,255,.15)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#c26bff);transition:width .3s}

/* droite */
#rt{position:absolute;right:calc(10px + env(safe-area-inset-right));top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mm{width:120px;height:120px;filter:drop-shadow(0 0 8px rgba(139,92,246,.6))}
#breach{padding:6px 10px;border-radius:10px;background:rgba(20,8,40,.9);border:2px solid var(--c);box-shadow:0 0 14px var(--c);text-align:right;cursor:pointer;animation:pulse 1.6s infinite;max-width:220px}
#breach b{display:block;font-size:13px;color:var(--c);text-shadow:var(--st)}#breach small{font-size:10.5px;color:#ddd}
#buffs{text-align:right;font-weight:900;font-size:12.5px;text-shadow:var(--st);line-height:1.45;pointer-events:none}

/* barres */
#bars{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:min(46vw,520px);display:flex;flex-direction:column;gap:3px}
#hpb,#xpb{position:relative;height:15px;border-radius:8px;background:rgba(0,0,0,.65);border:1.5px solid rgba(255,255,255,.25);overflow:hidden}
#xpb{height:13px}
#hpb i{position:absolute;inset:0;background:linear-gradient(180deg,#ff6b81,#c81d45);transition:width .2s}
#xpb i{position:absolute;inset:0;background:linear-gradient(90deg,#6d28d9,#a855f7,#e879f9);transition:width .3s}
#hpb span,#xpb span{position:relative;display:block;text-align:center;font-size:11px;font-weight:900;line-height:13px;text-shadow:var(--st)}
#army{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);font-size:12.5px;text-shadow:var(--st);padding:2px 12px;border-radius:12px;background:rgba(30,10,70,.6);border:1px solid rgba(194,107,255,.5);white-space:nowrap}
#army b{color:#d8b4fe}#army em{color:var(--g);font-style:normal;font-weight:900}

/* actions */
#acts{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:12px;width:250px;height:190px}
.sk,.tog{position:absolute;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-weight:900;text-shadow:var(--st);overflow:hidden}
.sk{width:62px;height:62px;background:radial-gradient(circle at 40% 30%,#5b3bd6,#1e0b52);border:3px solid #a78bfa;box-shadow:0 0 12px rgba(139,92,246,.6),inset 0 3px 0 rgba(255,255,255,.25);font-size:11px}
.sk:active,.tog:active{transform:scale(.9)}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);height:0}
.sk span{position:relative}
.sk.cool{filter:grayscale(.6)}
#kStrike{right:92px;bottom:2px}#kDash{right:160px;bottom:22px}
#kArise{right:0;bottom:0;width:86px;height:86px;font-size:16px;background:radial-gradient(circle at 40% 30%,#a855f7,#3b0764);border-color:#f0abfc}
#kArise small{position:absolute;top:8px;right:14px;background:#ff3355;border-radius:10px;padding:0 6px;font-size:12px}
#kArise.ready{animation:glow 0.9s infinite}
@keyframes glow{50%{box-shadow:0 0 28px #e879f9,0 0 8px #fff;transform:scale(1.06)}}
#kUlt{right:12px;bottom:98px;width:66px;height:66px;font-size:9.5px;background:radial-gradient(circle,#2a0f5a,#0d0420)}
#kUlt svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#kUlt .ring{fill:none;stroke:rgba(255,255,255,.12);stroke-width:4}#kUlt .prog{fill:none;stroke:var(--g);stroke-width:4;stroke-dasharray:106.8;stroke-linecap:round}
#kUlt.ready{animation:glow .7s infinite;background:radial-gradient(circle,#a16207,#3b0764)}
.tog{width:50px;height:50px;border:2px solid #555;background:rgba(20,15,40,.85);font-size:10px;line-height:1;display:flex;flex-direction:column;justify-content:center}
.tog small{font-size:8.5px;color:#aaa}
.tog.on{border-color:#4ade80;background:radial-gradient(circle,#166534,#052e16);box-shadow:0 0 12px #4ade80}.tog.on small{color:#bbf7d0}
#tAuto{right:88px;bottom:96px}#tArise{right:150px;bottom:92px}

#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:radial-gradient(circle,rgba(139,92,246,.18),rgba(0,0,0,.15));opacity:0;transition:opacity .15s}
#joy.on{opacity:1}#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e9d5ff,#7c3aed);box-shadow:0 0 12px #8b5cf6}
#station{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 10px 8px 16px;border-radius:14px;background:rgba(15,8,35,.92);border:2px solid #c26bff;box-shadow:0 0 16px rgba(194,107,255,.5);cursor:pointer;font-size:15px;text-shadow:var(--st)}
#station span{padding:6px 12px;border-radius:9px;background:linear-gradient(#fde68a,#f59e0b);color:#3b1d00;font-weight:900;text-shadow:none}

/* étiquettes, dégâts */
.lab{position:absolute;left:0;top:0;text-align:center;white-space:nowrap}
.ln{font-size:11px;font-weight:900;text-shadow:var(--st);margin-bottom:2px}
.ln b{display:inline-block;min-width:18px;padding:0 4px;margin-right:4px;border-radius:4px;color:#000;text-shadow:none;font-size:10px}
.lb{width:70px;height:6px;margin:auto;border-radius:3px;background:rgba(0,0,0,.7);border:1px solid rgba(0,0,0,.9);overflow:hidden}
.lb i{display:block;height:100%;background:linear-gradient(#ff6b6b,#d61f3a)}
.lab.boss .lb{width:150px;height:9px}.lab.boss .ln{font-size:14px;color:#ffd1d9}.lab.elite .ln{color:#fde68a}
.lab.tgt .lb{box-shadow:0 0 0 2px #fff,0 0 8px #fff}
.dn{position:absolute;left:0;top:0;font-weight:900;font-size:18px;text-shadow:var(--st);white-space:nowrap;will-change:transform}
.dn.pl{color:#fff}.dn.sh{color:#c9a6ff;font-size:16px}.dn.crit{color:#ffcc33;font-size:26px}.dn.hurt{color:#ff4d6d;font-size:17px}
.dn.arise{font-size:30px;color:#e9d5ff;text-shadow:var(--st),0 0 14px #a855f7,0 0 30px #7c3aed;letter-spacing:2px}.dn.fail{font-size:18px;color:#94a3b8}.dn.gemf{color:#7dd3fc}
.coin{position:fixed;width:20px;height:20px;z-index:20;pointer-events:none}.coin svg{width:20px;height:20px}

/* toasts, bannière */
#toasts{position:absolute;left:50%;top:84px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.toast{padding:6px 16px;border-radius:10px;background:rgba(15,8,35,.92);border:1px solid rgba(194,107,255,.6);font-size:13px;font-weight:700;text-shadow:var(--st);animation:tin .25s;max-width:60vw;text-align:center}
.toast.gold{border-color:var(--g);color:#fde68a}.toast.bad{border-color:#ff3355;color:#fecdd3}.toast.good{border-color:#4ade80;color:#bbf7d0}
.toast.out{opacity:0;transition:opacity .5s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;opacity:0;transform:scale(1.4)}
#banner.show{opacity:1;transform:scale(1);transition:all .3s cubic-bezier(.2,1.6,.4,1)}
#banner b{display:block;font-size:40px;letter-spacing:4px;color:#fff;text-shadow:var(--st),0 0 24px var(--c),0 0 50px var(--c)}
#banner small{display:inline-block;margin-top:4px;padding:3px 18px;font-size:14px;font-weight:700;background:linear-gradient(90deg,transparent,rgba(0,0,0,.7),transparent);text-shadow:var(--st)}
#flash{position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(255,0,40,.0)}
#flash.hit{animation:hit .4s}@keyframes hit{from{box-shadow:inset 0 0 120px rgba(255,0,40,.75)}}
#fade{position:absolute;inset:0;background:#05040d;opacity:0}#fade.go{animation:fd .8s}@keyframes fd{from{opacity:1}}

/* carte d'éveil */
.arisec{position:fixed;right:calc(14px + env(safe-area-inset-right));top:calc(40% - var(--i,0) * 70px);z-index:15;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:12px;pointer-events:none;
 background:linear-gradient(90deg,rgba(76,29,149,.95),rgba(20,8,50,.9));border:2px solid #c26bff;box-shadow:0 0 18px rgba(194,107,255,.7);animation:ain .35s cubic-bezier(.2,1.5,.4,1);transition:top .2s}
.arisec.big{border-color:var(--g);box-shadow:0 0 26px #ffcc33}
.arisec.out{opacity:0;transform:translateX(40px);transition:all .4s}
@keyframes ain{from{transform:translateX(120%)}}
.arisec img{width:56px;height:56px}
.arisec small{font-size:10px;letter-spacing:2px;color:#e9d5ff}.arisec b{display:block;font-size:15px;text-shadow:var(--st)}
.arisec b i{font-style:normal;color:#000;padding:0 5px;border-radius:4px;margin-right:6px;font-size:12px;text-shadow:none}
.arisec span{font-size:11px}.arisec em{font-style:normal;font-weight:900;margin-right:3px;text-shadow:var(--st)}

/* panneaux */
.panel{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(3,2,10,.55);backdrop-filter:blur(2px);animation:pin .18s}
@keyframes pin{from{opacity:0}}
.pin{width:min(640px,92vw);max-height:90vh;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#1c1147,#0d0726);border:2px solid var(--c);box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 30px color-mix(in srgb,var(--c) 60%,transparent),inset 0 0 40px rgba(124,58,237,.18);animation:pz .22s cubic-bezier(.2,1.4,.4,1)}
.pin.wide{width:min(980px,96vw)}
@keyframes pz{from{transform:scale(.85)}}
.ph{display:flex;align-items:center;padding:8px 10px 8px 16px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#000),transparent);border-bottom:2px solid color-mix(in srgb,var(--c) 70%,transparent)}
.ph h2{font-size:22px;letter-spacing:1px;text-shadow:var(--st),0 0 12px var(--c)}
.x{margin-left:auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:18px;cursor:pointer;background:linear-gradient(#ff5b74,#b3122f);border:2px solid #ffd1d9;text-shadow:var(--st)}
.pb{padding:10px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.btn{border:none;border-radius:10px;padding:8px 14px;font:900 13px "Trebuchet MS",sans-serif;color:#fff;cursor:pointer;text-shadow:var(--st);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 rgba(0,0,0,.5);white-space:nowrap;display:inline-flex;align-items:center;gap:3px;justify-content:center}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn[disabled]{filter:grayscale(1) brightness(.6);pointer-events:none}
.btn.gold{background:linear-gradient(#fcd34d,#d97706)}.btn.green{background:linear-gradient(#4ade80,#15803d)}.btn.red{background:linear-gradient(#fb7185,#be123c)}.btn.blue{background:linear-gradient(#60a5fa,#1d4ed8)}.btn.purple{background:linear-gradient(#c084fc,#6d28d9)}.btn.grey{background:linear-gradient(#64748b,#334155)}
.btn.small{padding:5px 9px;font-size:11.5px}.btn.big{padding:12px 22px;font-size:16px}.btn.wide{width:100%;margin:6px 0}
.hint{font-size:12.5px;color:#c4b5fd;margin:4px 0 10px;line-height:1.4}
.bar2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chip{padding:4px 10px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);font-size:12.5px}.chip b{color:#d8b4fe}.chip.full b{color:#4ade80}
.seg{display:inline-flex;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.2);margin-left:auto}
.seg span{padding:5px 10px;font-size:12px;font-weight:900;cursor:pointer;background:rgba(0,0,0,.35)}.seg span.on{background:linear-gradient(#a855f7,#6d28d9)}
.seg.small{margin:0}.seg em{font-style:normal;font-size:11px;padding:5px 8px;color:#c4b5fd;background:rgba(0,0,0,.5)}
.seg.tabs{display:flex;margin:0 0 8px}.seg.tabs span{flex:1;text-align:center;border-bottom:3px solid transparent}.seg.tabs span.on{background:rgba(255,255,255,.08);border-color:var(--c);color:var(--c)}.seg.tabs span.locked{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px}
.sc{position:relative;border-radius:10px;padding:4px 4px 6px;text-align:center;cursor:pointer;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 35%,#1a0f40),#0d0726 75%);border:2px solid color-mix(in srgb,var(--rc) 70%,#000);box-shadow:inset 0 0 14px color-mix(in srgb,var(--rc) 30%,transparent)}
.sc.eq{box-shadow:0 0 0 2px #4ade80,inset 0 0 14px color-mix(in srgb,var(--rc) 30%,transparent)}
.sc img{width:84px;height:84px;display:block;margin:auto}
.sc .rk{position:absolute;left:4px;top:3px;font-size:15px;color:var(--rc);text-shadow:var(--st)}
.sc .ck{position:absolute;right:4px;top:3px;width:20px;height:20px;border-radius:50%;background:#16a34a;font-style:normal;font-weight:900;font-size:12px;line-height:20px;border:2px solid #bbf7d0}
.sc .lk{position:absolute;right:4px;bottom:34px;font-style:normal;font-size:12px}
.sc .nm{display:block;font-size:10.5px;font-weight:900;text-shadow:var(--st);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .dg{display:block;font-size:12px;font-weight:900;color:#ff8fa3;text-shadow:var(--st)}.sc .lv{position:absolute;right:5px;top:24px;font-size:9.5px;color:#ddd;text-shadow:var(--st)}
.empty{grid-column:1/-1;text-align:center;padding:30px;color:#c4b5fd}
.foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)}.foot.center{justify-content:center}
.sdet{display:flex;gap:14px;flex-wrap:wrap}
.sp{flex:0 0 220px;text-align:center;padding:10px;border-radius:12px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 40%,#1a0f40),#0d0726 70%);border:2px solid var(--rc);position:relative}
.sp img{width:160px;height:160px}.sp h3{font-size:18px;text-shadow:var(--st);margin-bottom:6px}
.rk.big{position:absolute;left:10px;top:6px;font-size:30px;color:var(--rc);text-shadow:var(--st),0 0 12px var(--rc)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:2px 4px}.kv b.red{color:#ff8fa3}
.sr{flex:1;min-width:300px}.sr h4{font-size:14px;margin-bottom:6px;text-shadow:var(--st)}.sr h4 small{font-weight:400;color:#c4b5fd;font-size:11px}
.srow{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:5px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.sn{flex:1;font-weight:900;font-size:14px;text-shadow:var(--st)}.sn small{display:block;font-weight:400;font-size:10.5px;color:#bbb;text-shadow:none}
.gv{font-size:15px;width:56px;text-align:right;text-shadow:var(--st)}
.gr{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#000;font-size:16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.sl{cursor:pointer;font-size:16px;opacity:.6}.sl.on{opacity:1}
.lvlrow{display:flex;gap:6px;margin-top:6px}.lvlrow .btn{flex:1}
.frow,.wrow,.djr,.qr{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.fi{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 30%,#0d0726);border:2px solid var(--c)}.fi svg{width:26px;height:26px;color:var(--c)}
