<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>UMBRA — L'Ascension des Ombres</title>
<style>
:root{--st:0 0 2px #000,0 2px 0 #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;--neon:#38bdf8;--g:#ffcc33}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05040d;color:#fff;font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
svg{width:1em;height:1em;vertical-align:-.15em}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud .ia{pointer-events:auto}
.tx{text-shadow:var(--st);font-weight:900}

/* grille hexagonale */
#hex{position:absolute;left:calc(6px + env(safe-area-inset-left));top:8px;width:128px}
.hx{position:absolute;width:58px;height:64px;cursor:pointer;filter:drop-shadow(0 3px 0 #050318) drop-shadow(0 0 6px rgba(56,189,248,.45))}
.hx:active{transform:scale(.9)}
.hx .o{position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#7dd3fc,#1e3a8a 55%,#38bdf8)}
.hx .i{position:absolute;inset:3px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:radial-gradient(circle at 50% 30%,var(--hc,#3b5bdb),#0c1240 75%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.hx svg{width:27px;height:27px;filter:drop-shadow(0 2px 0 #000)}
.hx span{font-size:8.5px;font-weight:900;text-shadow:var(--st);margin-top:1px;letter-spacing:.2px}
.hx .dot{position:absolute;top:2px;right:4px;width:14px;height:14px;border-radius:50%;background:#ff3355;border:2px solid #fff;box-shadow:0 0 8px #ff3355;animation:pulse 1s infinite;z-index:2}
@keyframes pulse{50%{transform:scale(1.25)}}

/* bandeau de mission */
#mis{position:absolute;left:50%;top:6px;transform:translateX(-50%);min-width:330px;max-width:46vw;padding:5px 12px 7px;border-radius:10px;background:linear-gradient(90deg,rgba(76,29,149,.95),rgba(30,27,95,.92));border:2px solid #a78bfa;box-shadow:0 0 14px rgba(167,139,250,.6),inset 0 0 14px rgba(167,139,250,.25);display:flex;gap:10px;align-items:center}
#misI{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px;background:radial-gradient(#c084fc,#3b0764);border:2px solid #e9d5ff}
#misI svg{width:22px;height:22px}
#misT{flex:1;min-width:0}
#misT b{display:block;font-size:13px;letter-spacing:.5px;text-shadow:var(--st);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#misT small{display:block;font-size:10.5px;color:#ddd6fe;text-shadow:var(--st)}
.pb2{height:7px;border-radius:4px;background:rgba(0,0,0,.55);overflow:hidden;margin-top:3px;border:1px solid rgba(255,255,255,.18)}
.pb2 i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#e879f9);transition:width .25s}
#mis.boss{border-color:#ff3355;background:linear-gradient(90deg,rgba(127,29,29,.95),rgba(60,10,30,.92));box-shadow:0 0 18px rgba(255,51,85,.7)}
#mis.boss .pb2 i{background:linear-gradient(90deg,#ff3355,#ff9a3c)}
#mis.boss #misI{background:radial-gradient(#fb7185,#7f1d1d);border-color:#fecdd3}

/* colonne droite */
#rc{position:absolute;right:calc(8px + env(safe-area-inset-right));top:6px;width:200px;text-align:right}
#dmgbox{display:inline-block;padding:4px 10px;border-radius:8px;background:rgba(8,12,40,.78);border:1px solid rgba(56,189,248,.5);font-size:11.5px;line-height:1.35;text-shadow:var(--st)}
#dmgbox b{font-size:13px}
#buffs{margin-top:6px;font-size:11.5px;font-weight:900;line-height:1.5;text-shadow:var(--st)}
#wprop{margin-top:4px;display:inline-block;padding:3px 8px;border-radius:8px;font-size:10.5px;font-weight:900;text-shadow:var(--st);background:rgba(0,0,0,.45);border:1px solid}

/* barre du bas */
#bot{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
#barRow{display:flex;align-items:flex-end;gap:8px}
.money{font-size:24px;font-weight:900;letter-spacing:.5px;text-shadow:var(--st),0 0 10px rgba(0,0,0,.6);display:flex;align-items:center;gap:4px;margin-bottom:8px;white-space:nowrap}
#cash{color:#7dff6a}#gems{color:#7dd3fc}
.money svg{width:30px;height:30px;filter:drop-shadow(0 2px 0 #000)}
#acts{display:flex;gap:5px}
.ac{position:relative;width:58px;height:62px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#24317a,#0b1035);border:2px solid #4f6bff;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 3px 0 #030516,0 0 10px rgba(79,107,255,.5)}
.ac:active{transform:scale(.92)}
.ac svg{width:30px;height:30px;filter:drop-shadow(0 2px 0 #000)}
.ac img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 2px #000)}
.ac span{font-size:8.5px;font-weight:900;text-shadow:var(--st);position:absolute;bottom:2px}
.ac .tg{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;padding:0 6px;border-radius:6px;background:#334155;border:1px solid #94a3b8;text-shadow:var(--st)}
.ac.on .tg{background:#15803d;border-color:#86efac;box-shadow:0 0 8px #4ade80}
.ac.big{width:72px;height:72px;border-color:#e879f9;background:radial-gradient(circle at 50% 35%,#9333ea,#2e1065);box-shadow:0 0 16px rgba(232,121,249,.65),inset 0 2px 0 rgba(255,255,255,.25)}
.ac.big.ready{animation:glow .8s infinite}
.ac .ct{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff3355;border:2px solid #fff;font-size:11px;font-weight:900;line-height:16px;text-align:center}
.ac.m1{border-color:#ff6b81;background:linear-gradient(180deg,#5a1a2e,#1c0610)}
@keyframes glow{50%{box-shadow:0 0 30px #e879f9,0 0 8px #fff;transform:scale(1.05)}}
#lvbar{position:relative;width:min(560px,60vw);height:15px;border-radius:8px;background:rgba(0,0,0,.7);border:1.5px solid rgba(255,255,255,.3);overflow:hidden}
#lvbar i{position:absolute;inset:0;background:linear-gradient(90deg,#f59e0b,#fcd34d);transition:width .3s}
#lvbar span{position:relative;display:block;text-align:center;font-size:10.5px;font-weight:900;line-height:13px;text-shadow:var(--st)}
#hpbar{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);width:200px;height:10px;border-radius:5px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);overflow:hidden}
#hpbar i{display:block;height:100%;background:linear-gradient(#4ade80,#16a34a);transition:width .15s}
#hpbar.low i{background:linear-gradient(#ff6b81,#c81d45)}

#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:radial-gradient(circle,rgba(56,189,248,.18),rgba(0,0,0,.15));opacity:0;transition:opacity .15s;pointer-events:none}
#joy.on{opacity:1}#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e0f2fe,#3b82f6);box-shadow:0 0 12px #38bdf8}

/* butin empilé */
#loot{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);display:flex;gap:6px;align-items:flex-end;pointer-events:none}
.lc{width:58px;padding:3px 2px 3px;border-radius:8px;text-align:center;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 40%,#101640),#0a0d2a 80%);border:2px solid var(--rc);box-shadow:0 0 10px color-mix(in srgb,var(--rc) 60%,transparent);animation:lin .25s cubic-bezier(.2,1.6,.4,1)}
.lc img,.lc svg{width:34px;height:34px;display:block;margin:auto;object-fit:contain}
.lc b{display:block;font-size:10.5px;text-shadow:var(--st);white-space:nowrap;overflow:hidden}
.lc small{display:block;font-size:8px;color:#ddd;text-shadow:var(--st);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc.out{opacity:0;transform:translateY(-14px);transition:all .4s}
@keyframes lin{from{transform:translateY(20px) scale(.5);opacity:0}}

/* lucky drops, bannières, toasts */
#lucky{position:absolute;left:50%;top:62px;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
.lk{padding:5px 16px;border-radius:8px;background:linear-gradient(90deg,rgba(76,29,149,.96),rgba(30,10,70,.92));border:2px solid var(--c);box-shadow:0 0 16px var(--c);font-size:13px;font-weight:900;text-shadow:var(--st);animation:lin .35s cubic-bezier(.2,1.6,.4,1);white-space:nowrap}
.lk em{font-style:normal;color:var(--c)}
.lk.out{opacity:0;transition:opacity .5s}
#banner{position:absolute;left:0;right:0;top:28%;text-align:center;opacity:0;transform:scale(1.4);pointer-events:none}
#banner.show{opacity:1;transform:scale(1);transition:all .3s cubic-bezier(.2,1.6,.4,1)}
#banner b{display:block;font-size:42px;letter-spacing:4px;text-shadow:var(--st),0 0 24px var(--c),0 0 50px var(--c)}
#banner small{display:inline-block;margin-top:4px;padding:3px 22px;font-size:14px;font-weight:900;background:linear-gradient(90deg,transparent,rgba(0,0,0,.75),transparent);text-shadow:var(--st)}
#zt{position:absolute;left:50%;top:18%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .7s;pointer-events:none;white-space:nowrap}
#zt.show{opacity:1}
#ztn{font-size:38px;font-weight:900;letter-spacing:4px;text-transform:uppercase;text-shadow:var(--st),0 0 20px var(--c),0 0 40px var(--c)}
#zts{font-size:13px;font-weight:900;letter-spacing:2px;color:#e0e7ff;text-shadow:var(--st)}
#toasts{position:absolute;left:50%;top:120px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.toast{padding:6px 16px;border-radius:10px;background:rgba(10,14,45,.94);border:1px solid #4f6bff;font-size:13px;font-weight:700;text-shadow:var(--st);animation:lin .25s;max-width:60vw;text-align:center}
.toast.gold{border-color:var(--g);color:#fde68a}.toast.bad{border-color:#ff3355;color:#fecdd3}.toast.good{border-color:#4ade80;color:#bbf7d0}
.toast.out{opacity:0;transition:opacity .5s}
#flash{position:absolute;inset:0;pointer-events:none}
#flash.hit{animation:hit .35s}@keyframes hit{from{box-shadow:inset 0 0 110px rgba(255,0,40,.7)}}
#fade{position:absolute;inset:0;background:#05040d;opacity:0;pointer-events:none}#fade.go{animation:fd .9s}@keyframes fd{from{opacity:1}}
.arc{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(44% - var(--i,0) * 64px);z-index:15;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:12px;pointer-events:none;background:linear-gradient(90deg,rgba(76,29,149,.96),rgba(20,8,50,.92));border:2px solid var(--c);box-shadow:0 0 18px var(--c);animation:ain .35s cubic-bezier(.2,1.5,.4,1);transition:top .2s}
.arc.out{opacity:0;transform:translateX(40px);transition:all .4s}
@keyframes ain{from{transform:translateX(120%)}}
.arc svg,.arc img{width:48px;height:48px;object-fit:contain;border-radius:50%;background:radial-gradient(#4c1d95,#05030f)}
.arc small{font-size:9.5px;letter-spacing:2px;color:#e9d5ff}.arc b{display:block;font-size:14px;text-shadow:var(--st)}
.arc b i{font-style:normal;color:#000;padding:0 5px;border-radius:4px;margin-right:5px;font-size:11px;text-shadow:none}

/* étiquettes et dégâts */
#labels,#dmgs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;will-change:transform}
.ln{font-size:10.5px;font-weight:900;text-shadow:var(--st);margin-bottom:2px}
.lb{width:64px;height:6px;margin:auto;border-radius:3px;background:rgba(0,0,0,.75);border:1px solid #000;overflow:hidden}
.lb i{display:block;height:100%;background:linear-gradient(#ff6b6b,#d61f3a)}
.lab.k1 .ln{color:#fdba74}.lab.k1 .lb{width:90px;height:8px}
.lab.k2 .ln{font-size:14px;color:#fecdd3}.lab.k2 .lb{width:150px;height:10px}
.dn{position:absolute;left:0;top:0;font-weight:900;font-size:17px;text-shadow:var(--st);white-space:nowrap;will-change:transform}
.dn.pl{color:#fff}.dn.sh{color:#d8b4fe;font-size:14px}.dn.crit{color:#ffcc33;font-size:25px}.dn.hurt{color:#ff4d6d;font-size:15px}
.dn.arise{font-size:28px;color:#f5d0fe;text-shadow:var(--st),0 0 14px #a855f7,0 0 30px #7c3aed;letter-spacing:2px}.dn.fail{font-size:16px;color:#94a3b8}

/* panneaux */
.panel{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(2,4,16,.55);animation:pin .15s}
@keyframes pin{from{opacity:0}}
.pw{position:relative;display:flex;gap:6px;max-width:96vw}
.pin{width:min(760px,84vw);height:min(88vh,520px);display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#121a4d,#080b2a);border:2px solid #38bdf8;box-shadow:0 0 0 2px #050818,0 0 26px rgba(56,189,248,.55),inset 0 0 40px rgba(56,189,248,.12);animation:pz .2s cubic-bezier(.2,1.4,.4,1)}
@keyframes pz{from{transform:scale(.88)}}
.ph{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:linear-gradient(90deg,#1d4ed8,#0e2a7a 60%,transparent);border-bottom:2px solid #38bdf8}
.ph svg{width:26px;height:26px}
.ph h2{font-size:19px;letter-spacing:.5px;text-shadow:var(--st)}
.ph .sub{font-size:11px;color:#bae6fd;margin-left:6px;text-shadow:var(--st)}
.x{margin-left:auto;width:34px;height:34px;display:grid;place-items:center;font-weight:900;font-size:17px;cursor:pointer;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(#ff5b74,#b3122f);text-shadow:var(--st)}
.pbody{flex:1;display:flex;gap:8px;padding:8px;min-height:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;min-height:0}
.side{display:flex;flex-direction:column;gap:6px;justify-content:flex-start;padding-top:6px}
.stab{width:66px;height:62px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(180deg,#1e2a6e,#0b1035);border:2px solid #3b5bdb;box-shadow:0 3px 0 #030516}
.stab svg,.stab img{width:28px;height:28px;object-fit:contain}.stab span{font-size:9px;font-weight:900;text-shadow:var(--st)}
.stab.on{border-color:#7dd3fc;background:linear-gradient(180deg,#2563eb,#1e3a8a);box-shadow:0 0 12px #38bdf8}
.tools{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.chip{padding:3px 9px;border-radius:8px;background:rgba(0,0,0,.45);border:1px solid rgba(125,211,252,.35);font-size:12px;font-weight:900;text-shadow:var(--st)}
.btn{border:none;border-radius:9px;padding:7px 12px;font:900 12.5px "Trebuchet MS",sans-serif;color:#fff;cursor:pointer;text-shadow:var(--st);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 rgba(0,0,0,.5);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;justify-content:center}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn[disabled]{filter:grayscale(1) brightness(.55);pointer-events:none}
.btn.g{background:linear-gradient(#4ade80,#15803d)}.btn.y{background:linear-gradient(#fcd34d,#d97706)}.btn.r{background:linear-gradient(#fb7185,#be123c)}.btn.b{background:linear-gradient(#60a5fa,#1d4ed8)}.btn.p{background:linear-gradient(#c084fc,#6d28d9)}.btn.k{background:linear-gradient(#64748b,#334155)}
.btn svg{width:15px;height:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;align-content:start}

/* cartes d'objets (cadres de rareté) */
.card{position:relative;aspect-ratio:1/1.12;border-radius:10px;cursor:pointer;padding:2px;background:linear-gradient(150deg,var(--rc),color-mix(in srgb,var(--rc) 25%,#000) 45%,var(--rc));box-shadow:0 0 10px color-mix(in srgb,var(--rc) 55%,transparent),0 3px 0 #02030c}
.card .in{position:absolute;inset:2px;border-radius:8px;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--rc) 45%,#0b1035),#060920 72%);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.card .in:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.035) 14px 16px)}
.card.rb{background:conic-gradient(from var(--a,0deg),#ff3b5c,#ffcc33,#4ade80,#38bdf8,#c26bff,#ff3b5c);animation:rb 2.5s linear infinite}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes rb{to{--a:360deg}}
.card .ic{position:relative;width:70%;height:58%;margin-top:9%;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(0,0,0,.8)) drop-shadow(0 0 6px color-mix(in srgb,var(--rc) 70%,transparent))}
.card svg.ic{width:62%;height:54%}
.card .rk{position:absolute;left:4px;top:2px;font-size:12.5px;font-weight:900;color:var(--rc);text-shadow:var(--st);z-index:2}
.card .ck{position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#16a34a;font-size:11px;font-weight:900;line-height:16px;text-align:center;border:2px solid #bbf7d0;z-index:2}
.card .nm{position:relative;font-size:9.5px;font-weight:900;text-shadow:var(--st);width:96%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
.card .pw2{position:relative;font-size:11px;font-weight:900;color:#ff8fa3;text-shadow:var(--st);margin-bottom:3px}
.card .lv{position:absolute;right:4px;top:22px;font-size:9px;font-weight:900;color:#e0e7ff;text-shadow:var(--st)}
.card .stars{position:absolute;left:0;right:0;top:56%;text-align:center;font-size:9px;color:#ffcc33;text-shadow:var(--st);letter-spacing:-1px}
.card.lock{filter:grayscale(1) brightness(.45)}.card.lock .ic{filter:brightness(0) drop-shadow(0 0 2px #556)}
.card.sel{outline:3px solid #fff;outline-offset:1px}
.card .q{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:900;color:#94a3b8;text-shadow:var(--st)}

/* détail */
.det{width:250px;flex:none;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;background:linear-gradient(180deg,rgba(30,41,110,.6),rgba(8,11,42,.8));border:1px solid rgba(125,211,252,.35)}
.det .big{width:104px;flex:none;margin:0 auto;aspect-ratio:1/1.12}
.det h3{font-size:16px;text-align:center;text-shadow:var(--st);line-height:1.1}
.det .rar{text-align:center;font-size:11.5px;font-weight:900;letter-spacing:1px;text-shadow:var(--st)}
.det p{font-size:11.5px;color:#c7d2fe;text-align:center;line-height:1.3}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.3)}
.kv b{color:#7dff6a}.kv b.red{color:#ff8fa3}.kv b.cy{color:#7dd3fc}
.det .row{display:flex;gap:5px}.det .row .btn{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:30px;color:#93c5fd;font-weight:700}

/* accessoires : mannequin */
.man{width:150px;flex:none;position:relative;border-radius:12px;background:radial-gradient(circle at 50% 40%,#1e3a8a,#060920 75%);border:1px solid rgba(125,211,252,.35)}
.man .body{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:170px;opacity:.85}
.slot{position:absolute;width:56px;height:62px}
.slot .lab2{position:absolute;left:0;right:0;top:-12px;text-align:center;font-size:9px;font-weight:900;text-shadow:var(--st);color:#bae6fd}
.slot .card{width:100%;height:100%}
.slot.emp{border:2px dashed rgba(125,211,252,.45);border-radius:10px;background:rgba(0,0,0,.3)}

/* mondes */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wc{position:relative;min-height:150px;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 45%,#0b1035),#060920 70%);border:2px solid var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent),inset 0 -50px 50px rgba(0,0,0,.35)}
.wc .num{position:absolute;right:8px;top:6px;font-size:28px;font-weight:900;color:color-mix(in srgb,var(--c) 70%,#fff);opacity:.35}
.wc b{font-size:16px;text-shadow:var(--st)}.wc small{font-size:11px;color:#e0e7ff;text-shadow:var(--st)}
.wc .prop{font-size:11px;font-weight:900;color:var(--c);text-shadow:var(--st)}
.wc .mi{font-size:10.5px;color:#c7d2fe}
.wc .btn{margin-top:auto}
.wc.lockd{filter:grayscale(.85) brightness(.55)}
.wc.here{box-shadow:0 0 0 3px #4ade80,0 0 18px #4ade80}

/* listes (quêtes, succès, stats) */
.li{display:flex;align-items:center;gap:10px;padding:7px 10px;margin-bottom:6px;border-radius:10px;background:linear-gradient(90deg,rgba(30,41,110,.6),rgba(8,11,42,.6));border:1px solid rgba(125,211,252,.3)}
.li .ico{width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;background:radial-gradient(#3b5bdb,#0b1035);border:2px solid #7dd3fc}
.li .ico svg{width:28px;height:28px}
.li .tt{flex:1;min-width:0}.li .tt b{font-size:13.5px;text-shadow:var(--st)}.li .tt small{display:block;font-size:11px;color:#c7d2fe}
.li .rw{font-size:12px;font-weight:900;color:#7dd3fc;text-shadow:var(--st);white-space:nowrap}
.li.done{opacity:.5}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stbox{padding:6px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid rgba(125,211,252,.25)}
.stbox h4{font-size:13px;margin:0 0 4px;color:#7dd3fc;text-shadow:var(--st)}
.stbox .kv{margin-bottom:3px;background:linear-gradient(90deg,rgba(127,29,29,.55),rgba(0,0,0,.3));border:1px solid rgba(255,100,100,.25)}
.stbox .kv b{color:#fff}

/* autel */
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:6px 0}
.rate{padding:5px;border-radius:8px;text-align:center;border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 18%,#060920);font-size:11px;font-weight:900;text-shadow:var(--st)}
.rate b{display:block;font-size:15px;color:var(--rc)}
.pulls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pulls .card{width:74px;animation:pop .45s backwards}
@keyframes pop{from{transform:scale(0) rotate(-25deg);opacity:0}}


/* portails */
#pban{position:absolute;left:50%;top:64px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:3px 12px 4px 6px;border-radius:9px;cursor:pointer;background:linear-gradient(90deg,rgba(40,16,90,.95),rgba(14,10,50,.9));border:2px solid var(--c);box-shadow:0 0 12px var(--c);white-space:nowrap}
#pban b{display:block;font-size:11.5px;color:var(--c);text-shadow:var(--st)}#pban small{font-size:10px;color:#e0e7ff;text-shadow:var(--st)}
#parr{width:24px;height:24px;display:grid;place-items:center;font-size:18px;color:var(--c);text-shadow:var(--st)}
#penter{position:absolute;left:50%;bottom:128px;transform:translateX(-50%);padding:10px 22px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:900;text-shadow:var(--st);background:linear-gradient(#7c3aed,#3b0764);border:2px solid var(--c);box-shadow:0 0 22px var(--c);animation:glow .9s infinite;white-space:nowrap}
#penter b{color:var(--c);font-size:19px}
/* ombres : portraits, traits, identité */
.card.shc .in{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--rc) 60%,#1a0f40),#05030f 78%)}
.card.shc .port{width:92%;height:70%;margin-top:2%;object-fit:contain;filter:drop-shadow(0 0 6px var(--rc)) drop-shadow(0 3px 2px #000)}
.card .rk.big{font-size:19px;left:5px;top:0;text-shadow:var(--st),0 0 8px var(--rc)}
.card.uq{box-shadow:0 0 0 2px #ffcc33,0 0 14px #ffcc33}
.utag{position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);font-size:7.5px;font-weight:900;letter-spacing:1px;padding:0 6px;border-radius:5px;background:linear-gradient(#fde68a,#d97706);color:#3b1d00;z-index:3}
.card .aw{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:9px;color:#ffcc33;text-shadow:var(--st);z-index:2}
.traits{display:flex;flex-direction:column;gap:3px}
.trait{display:flex;justify-content:space-between;gap:6px;font-size:11px;padding:3px 7px;border-radius:6px;background:rgba(124,58,237,.25);border:1px solid rgba(194,107,255,.45)}
.trait b{color:#e9d5ff}.trait span{color:#7dff6a;font-weight:900}
.trait.sig{background:rgba(217,119,6,.28);border-color:#fcd34d}.trait.sig b{color:#fde68a}
.trait.none span{color:#94a3b8;font-weight:400}
.quote{font-style:italic;font-size:11px!important;color:#e9d5ff!important}
.born{font-size:10.5px!important;color:#93c5fd!important}
.reveal{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--c) 35%,#05030f) 0%,rgba(3,2,10,.94) 65%);animation:pin .25s;overflow:hidden}
.reveal .rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(color-mix(in srgb,var(--c) 30%,transparent) 0 8deg,transparent 8deg 20deg);animation:spin 18s linear infinite;opacity:.5}
.rv{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:min(430px,90vw);animation:pz .45s cubic-bezier(.2,1.6,.4,1)}
.rvk{font-size:12px;font-weight:900;letter-spacing:6px;color:var(--c);text-shadow:var(--st)}
.rvp{position:relative;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,#1a0f40),#05030f 72%);border:3px solid var(--c);box-shadow:0 0 34px var(--c),inset 0 0 26px var(--c)}
.rvp img{width:100%;height:100%;object-fit:contain;border-radius:50%;filter:drop-shadow(0 0 8px var(--c))}
.rvr{position:absolute;right:-12px;bottom:-6px;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:32px;font-weight:900;color:#000;background:var(--c);border:3px solid #fff;box-shadow:0 0 18px var(--c);transform:rotate(8deg)}
.rv h2{font-size:30px;letter-spacing:1px;text-shadow:var(--st),0 0 18px var(--c)}
.rvt{font-size:13px;font-weight:900;color:var(--c);text-shadow:var(--st)}
.rv .traits{width:100%}.rvd{font-size:13px;font-weight:900;text-shadow:var(--st);margin-top:2px}
.rv small{font-size:10.5px;color:#94a3b8;margin-top:4px}
/* panneau des portails */
.dgl{width:250px;flex:none;display:flex;flex-direction:column;gap:5px}
.dgr{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:10px;cursor:pointer;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,#0b1035),#080b2a);border:2px solid color-mix(in srgb,var(--c) 55%,#000)}
.dgr.on{border-color:var(--c);box-shadow:0 0 12px var(--c)}
.dgr>div{flex:1;min-width:0}.dgr b{font-size:12px;text-shadow:var(--st);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dgr small{font-size:10.5px;font-weight:900}
.rkb{width:34px;height:34px;flex:none;border-radius:9px;display:grid!important;place-items:center;font-size:20px!important;color:#000;background:var(--c);text-shadow:none!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.keyn{font-size:12px;font-weight:900;text-shadow:var(--st);white-space:nowrap}.keyn svg{width:16px;height:16px}
.dgd{flex:1;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,#0b1035),rgba(8,11,42,.85));border:1px solid var(--c)}
.dgh{display:flex;gap:10px;align-items:center}.dgh h3{font-size:18px;text-shadow:var(--st)}.dgh small{font-size:11px;color:#c7d2fe}
.dgk{width:56px;height:56px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:36px;font-weight:900;color:#000;background:var(--c);border:3px solid #fff;box-shadow:0 0 16px var(--c)}
.verdict{text-align:center;font-size:15px;font-weight:900;letter-spacing:1px;padding:4px;border-radius:8px;border:2px solid;background:rgba(0,0,0,.35);text-shadow:var(--st)}
.bossrow{display:flex;gap:10px;align-items:center;padding:5px 8px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid rgba(252,211,77,.5)}
.bossrow img{width:58px;height:58px;border-radius:50%;background:radial-gradient(#4c1d95,#05030f);border:2px solid #fcd34d}
.bossrow small{display:block;font-size:9px;letter-spacing:1px;color:#fde68a}.bossrow b{display:block;font-size:13.5px;text-shadow:var(--st)}.bossrow span{font-size:11px;font-weight:900}
.mi2{font-size:11px;color:#c7d2fe;line-height:1.35}
.card img.ic{image-rendering:auto}

/* chargement */
#load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#3b1d8f 0%,#160a3d 40%,#030208 80%);transition:opacity .7s}
#load.out{opacity:0;pointer-events:none}
#load:before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,rgba(168,85,247,.28),transparent 30%,rgba(56,189,248,.18),transparent 60%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#logo{position:relative;text-align:center}
#logo h1{font-size:min(17vw,124px);font-weight:900;letter-spacing:.14em;line-height:1;background:linear-gradient(180deg,#fff 15%,#e9d5ff 45%,#a855f7 70%,#3b0764);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #a855f7) drop-shadow(0 4px 0 #1e0b4b);animation:flick 3s infinite}
@keyframes flick{0%,100%{filter:drop-shadow(0 0 18px #a855f7) drop-shadow(0 4px 0 #1e0b4b)}50%{filter:drop-shadow(0 0 34px #e879f9) drop-shadow(0 4px 0 #1e0b4b)}}
#logo p{font-size:14px;letter-spacing:.6em;color:#e9d5ff;text-shadow:var(--st);margin-top:6px}
#lbarw{position:relative;width:min(420px,70vw);height:12px;border-radius:6px;background:rgba(0,0,0,.6);border:1px solid #a855f7;overflow:hidden}
#lbar{height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#e879f9)}
#lpct{position:relative;font-size:12px;color:#ddd6fe;text-shadow:var(--st)}
#lstart{position:relative;padding:12px 46px;font:900 20px "Trebuchet MS",sans-serif;letter-spacing:3px;color:#fff;border:2px solid #f5d0fe;border-radius:12px;background:linear-gradient(#a855f7,#6d28d9);text-shadow:var(--st);box-shadow:0 0 24px #a855f7,0 4px 0 #2e1065;animation:glow 1.4s infinite;cursor:pointer}
#ltip{position:relative;font-size:12px;color:#c4b5fd;text-shadow:var(--st);max-width:70vw;text-align:center}
#rot{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:#05040d;color:#e9d5ff;font-weight:900;text-align:center;padding:30px}
@media (orientation:portrait){#rot{display:grid}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="load"><div id="logo"><h1>UMBRA</h1><p>L'ASCENSION DES OMBRES</p></div><div id="lbarw"><div id="lbar"></div></div><div id="lpct">0%</div><button id="lstart" hidden>JOUER</button><div id="ltip">Abats tes ennemis, puis touche S'ÉLEVER pour en faire tes ombres.</div></div>
<div id="rot">Tourne ton téléphone en mode paysage</div>
<script type="importmap">{"imports":{"three":"./lib/three/build/three.module.js","three/addons/":"./lib/three/examples/jsm/"}}</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
