<style>
@font-face{font-family:'Grenze Gotisch';src:url(assets/fonts/grenze.woff) format('woff');font-weight:100 900;font-display:swap}
@font-face{font-family:'Alegreya Sans';src:url(assets/fonts/as400.woff) format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Alegreya Sans';src:url(assets/fonts/as500.woff) format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'Alegreya Sans';src:url(assets/fonts/as700.woff) format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'Alegreya Sans';src:url(assets/fonts/as800.woff) format('woff');font-weight:800;font-display:swap}
@font-face{font-family:'Alegreya Sans SC';src:url(assets/fonts/sc500.woff) format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'Alegreya Sans SC';src:url(assets/fonts/sc700.woff) format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'Alegreya Sans SC';src:url(assets/fonts/sc800.woff) format('woff');font-weight:800;font-display:swap}
</style>
<style>
/* Concept : HUD de MMO sombre (ardoise + bronze) au-dessus d'une scène 3D ; panneaux de commerce en parchemin. Un seul thème, volontairement sombre. */
:root{
  --nuit:#120b1b; --ardoise:#241c2c; --ardoise2:#33283d; --bronze:#b98a4a; --or:#f2cd78; --parchemin:#ead2a4; --parchemin2:#d9b985; --encre:#3a2312;
  --sang:#d0322a; --mana:#3f86e6; --vert:#4fd16a; --texte:#f4ead8; --gris:#a59cae;
  --f-titre:'Grenze Gotisch', 'Times New Roman', serif; --f-label:'Alegreya Sans SC', 'Trebuchet MS', sans-serif; --f-texte:'Alegreya Sans', 'Trebuchet MS', sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--nuit);color:var(--texte);font-family:var(--f-texte);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#jeu{position:fixed;inset:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--f-label);color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.contour{text-shadow:0 1px 2px #000,0 0 3px #000}

/* ---------- étiquettes et chiffres ---------- */
#labels,#nombres{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.plaque{position:absolute;left:0;top:0;will-change:transform;contain:layout style;backface-visibility:hidden;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;font-family:var(--f-label);font-weight:700;line-height:1}
.plaque .n{font-size:clamp(11px,1.9vh,15px);color:#fff}
.plaque .n b{display:inline-block;background:#e9c241;color:#2a1a05;padding:0 3px;margin-right:2px;border-radius:2px}
.plaque .gd{font-size:clamp(9px,1.4vh,11px);color:#7fb2ff;letter-spacing:.04em}
.plaque .gd.urgent{color:#ff7a6a;font-weight:900;animation:pulse .5s infinite}
.plaque.ennemi .n{color:#ff8a7a}
.plaque.pnj .n{color:#ffd97a}
.plaque .vie{width:64px;height:5px;margin:2px auto 0;background:#1a0f12;border:1px solid #000;border-radius:2px;overflow:hidden}
.plaque .vie i{display:block;height:100%;background:linear-gradient(#ff6a5a,#b8231d)}
.plaque.allie .vie i{background:repeating-linear-gradient(90deg,#e9c241 0 12px,#b98a2a 12px 13px)}
.dmg{position:absolute;font-family:var(--f-label);font-weight:800;font-size:clamp(16px,3.2vh,26px);color:#fff;transform:translate(-50%,-50%);animation:monte .9s ease-out forwards}
.dmg.crit{color:#ffd23a;font-size:clamp(22px,4.4vh,36px)}
.dmg.joueur{color:#ff4a4a}
.dmg.soin{color:#6aff7a}
.dmg.info{color:#cfe0ff;font-size:clamp(13px,2.3vh,18px)}
@keyframes monte{0%{opacity:0;margin-top:0;scale:.6}15%{opacity:1;scale:1.25}30%{scale:1}100%{opacity:0;margin-top:-60px}}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
.metal{background:radial-gradient(circle at 35% 30%,#4d4256,#1d1623 70%);border:3px solid #8d8394;box-shadow:inset 0 0 0 2px #1b141f,0 2px 6px #000a}
#hudG{position:absolute;left:calc(env(safe-area-inset-left,0px) + 1.5vh);top:1.2vh;display:flex;flex-direction:column;gap:2.6vh;pointer-events:none;z-index:3}
#hudG .rangee{display:flex;gap:1.6vh;align-items:flex-start;pointer-events:auto}
#portrait{display:flex;align-items:center;pointer-events:none}
#hudD{position:absolute;right:calc(env(safe-area-inset-right,0px) + 1.6vh);top:1.2vh;display:flex;flex-direction:column;align-items:center;pointer-events:none}
#carteCadre{width:28vh;height:28vh;display:grid;place-items:center;margin-top:1vh}
#ipHud{display:inline-block;margin-left:1vh;padding:0 .8vh;border-radius:.6vh;background:#3a2312;color:#ffd27a;font-size:1.9vh;vertical-align:middle}
#portrait .avatar{width:11vh;height:11vh;border-radius:50%;overflow:hidden;position:relative;z-index:2}
#portrait .avatar canvas{width:100%;height:100%}
#portrait .bloc{margin-left:-2vh;padding-left:2.6vh;display:flex;flex-direction:column;gap:.3vh}
#portrait .nom{font-family:var(--f-label);font-weight:800;font-size:2.4vh;color:var(--encre);background:linear-gradient(#f0d9ad,#cfae78);padding:.2vh 2vh;border-radius:0 1vh 1vh 0;width:max-content;min-width:20vh}
.barre{width:23vh;height:2vh;background:#1a1016;border:2px solid #5a4e60;border-radius:0 1vh 1vh 0;position:relative;overflow:hidden}
.barre i{position:absolute;inset:0;transform-origin:left}
.barre.pv i{background:linear-gradient(#ff6b5f,#b52016)}
.barre.pv i.bouclier{background:linear-gradient(#c8ecff,#62b0ff);opacity:.85}
.barre.en i{background:linear-gradient(#6fb2ff,#2459c2)}
.barre span{position:absolute;inset:0;text-align:center;font-family:var(--f-label);font-weight:800;font-size:1.6vh;line-height:1.75vh;color:#fff}
#buffs{display:flex;gap:.5vh;margin-top:.3vh;min-height:3.4vh}
.buff{width:3.4vh;height:3.4vh;border-radius:50%;border:2px solid #7a6e80;display:grid;place-items:center;font-size:1.3vh;font-weight:800}

#colonne{display:flex;flex-direction:column;gap:1.4vh;margin-left:1.1vh}
.rond{width:6.6vh;height:6.6vh;border-radius:50%;display:grid;place-items:center;padding:0}
.rond svg{width:58%;height:58%}
#journal{width:31vh;max-width:34vw;background:linear-gradient(#2a2131ee,#1d1623ee);border:1px solid #4e4356;border-radius:4px;overflow:hidden}
#journal .t{display:flex;align-items:center;gap:1vh;padding:.8vh 1.2vh;background:#3a2f42;font-family:var(--f-label);font-weight:800;font-size:2.1vh;color:var(--or)}
#journal .o{padding:.9vh 1.2vh;font-size:1.9vh;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#journal .prog{height:.8vh;background:#3a1418;margin:0 1.2vh 1vh;border-radius:3px;overflow:hidden}
#journal .prog i{display:block;height:100%;background:linear-gradient(90deg,#ff3a2a,#ff9a4a);width:0}
#argent{display:flex;align-items:center;gap:.6vh;padding:0 1.2vh 1vh;font-family:var(--f-label);font-weight:800;font-size:1.9vh;color:#e8e3ef}
.piece{width:1.8vh;height:1.8vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9bcc6 45%,#6b6f7a);display:inline-block}

#zone{width:27vh;padding:.6vh 1.4vh;background:linear-gradient(#e8d2a6,#c9a874);border:2px solid #6e5232;border-radius:6px;color:var(--encre);pointer-events:none}
#zone .nom{font-family:var(--f-label);font-weight:800;font-size:2.4vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zone .ligne{display:flex;justify-content:space-between;font-family:var(--f-label);font-weight:700;font-size:2vh}
#carteMini{width:18.5vh;height:18.5vh;transform:rotate(45deg);border:2px solid #8a6a3a;background:#120c18cc;box-shadow:0 0 12px #000;overflow:hidden;pointer-events:none}
#carteMini canvas{width:100%;height:100%;display:block}
#btnSac{position:absolute;right:calc(env(safe-area-inset-right,0px) + 1.6vh);top:1.2vh;width:8.4vh;height:8.4vh}
#btnPerso{position:absolute;right:calc(env(safe-area-inset-right,0px) + 2.4vh);top:12vh}
#btnReglages{position:absolute;right:calc(env(safe-area-inset-right,0px) + 2.4vh);top:21vh}

#bossbar{position:absolute;left:50%;top:1.4vh;transform:translateX(-50%);display:flex;align-items:center;gap:1vh;pointer-events:none}
#bossbar .ico{width:8vh;height:8vh;border-radius:50%;border:3px solid #d8a640;background:radial-gradient(#ff8a3a,#5a0e0a);display:grid;place-items:center;box-shadow:0 0 18px #ff3a1a88}
#bossbar .ico svg{width:60%}
#bossbar .nom{font-family:var(--f-label);font-weight:800;font-size:2.2vh;color:#ffd9a0}
#bossbar .barre{width:36vh;height:2.4vh}
#bossbar .barre i{background:linear-gradient(#ff5a3a,#8a1408)}

/* sorts : disposition calquée sur l'interface de référence */
#sorts{position:absolute;right:var(--decalSorts,18vw);bottom:0;width:60vh;height:50vh;pointer-events:none}
.sort{position:absolute;transform:translate(50%,50%);border-radius:50%;padding:0;border:0;pointer-events:auto;background:none;touch-action:none}
.sort .cadre{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 200deg,#6a5e72,#cbc3d2,#5d5266,#a99fb2,#6a5e72);padding:.45vh}
.sort .cadre > div{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;background:#120c16}
.sort svg.ic{width:100%;height:100%;display:block}
.sort .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#000c var(--k,0turn),transparent 0);}
.sort .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-label);font-weight:800;font-size:3.6vh;color:#fff}
.sort .t{position:absolute;right:-.2vh;bottom:-.4vh;font-family:var(--f-label);font-weight:800;font-size:1.8vh;color:#f2cd78;text-shadow:0 0 3px #000,0 0 3px #000}
.sort.off{filter:grayscale(1) brightness(.5)}
.sort.manque .cadre > div::after{content:"";position:absolute;inset:0;background:#1a2a6a88}
.sort:active{scale:.93}
.sort.pret .cadre{animation:pret .5s}
@keyframes pret{50%{box-shadow:0 0 18px 4px #fff8}}
#s-ATK{right:25.2vh;bottom:25.9vh;width:15vh;height:15vh}
#s-ATK .cadre{padding:.7vh;background:conic-gradient(from 200deg,#7b7085,#e8e2ee,#6a5e72,#c3bacb,#7b7085)}
#s-Q{right:40.5vh;bottom:19.4vh;width:9.4vh;height:9.4vh}
#s-W{right:40.5vh;bottom:32.9vh;width:9.4vh;height:9.4vh}
#s-E{right:27.5vh;bottom:41.7vh;width:9.4vh;height:9.4vh}
#s-D{right:13.6vh;bottom:38.9vh;width:9.4vh;height:9.4vh}
#s-R{right:27.5vh;bottom:10.6vh;width:9.4vh;height:9.4vh}
#s-F{right:13.6vh;bottom:13vh;width:9.4vh;height:9.4vh}
#s-POT{right:53vh;bottom:18vh;width:8vh;height:8vh}
#s-POT .compte{position:absolute;top:-.6vh;left:50%;transform:translateX(-50%);font-family:var(--f-label);font-weight:800;font-size:1.6vh;color:#fff;text-shadow:0 0 3px #000}
#s-CIBLE{right:8.5vh;bottom:25.9vh;width:7.4vh;height:7.4vh}
#s-CIBLE.actif .cadre{background:conic-gradient(#ff6a3a,#ffd27a,#ff6a3a)}

#action{position:absolute;left:50%;bottom:16vh;transform:translateX(-50%);padding:1.2vh 3.4vh;font-size:2.6vh;font-weight:800;color:#2a1608;background:linear-gradient(#ffe7a8,#d9a64a);border:2px solid #6e4a1a;border-radius:4vh;box-shadow:0 0 0 3px #00000055,0 0 22px #ffcf6a66;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px #00000055,0 0 34px #ffcf6aaa}}

#joy{position:absolute;left:calc(env(safe-area-inset-left,0px) + 22vh);bottom:19.6vh;width:22vh;height:22vh;transform:translate(-50%,50%);border-radius:50%;background:radial-gradient(#ffffff0a,#ffffff05 60%,#ffffff12 61%,transparent 63%);border:1px solid #ffffff22;pointer-events:none}
#joy .stick{position:absolute;left:50%;top:50%;width:9.5vh;height:9.5vh;margin:-4.75vh;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5a5463,#25202b);border:3px solid #8b8494;box-shadow:0 2px 8px #000}
#zoneJoy{position:absolute;left:0;bottom:0;width:42%;height:56%;pointer-events:auto;z-index:1}


#chat{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.4vh);transform:translateX(-50%);width:min(52vh,44vw);display:flex;flex-direction:column;align-items:center;gap:.8vh;pointer-events:none}
#chat .log{width:100%;font-size:2.2vh;line-height:1.3;color:#fff;display:flex;flex-direction:column;gap:.4vh}
#chat .log div{background:#0008;padding:.5vh 1vh;border-radius:4px;animation:fondu 9s forwards}
#chat .log b{color:#ffd97a}
@keyframes fondu{0%,85%{opacity:1}100%{opacity:0}}
#chat button{pointer-events:auto;padding:.6vh 4vh;font-size:2.2vh;font-weight:800;color:var(--or);background:linear-gradient(#4a4252,#25202b);border:2px solid #7a7082;border-radius:3vh}

#toast{position:absolute;left:50%;top:22vh;transform:translateX(-50%);text-align:center;pointer-events:none}
#toast div{font-family:var(--f-label);font-weight:800;font-size:3vh;color:#ffe2a0;animation:toast 2.6s forwards;white-space:nowrap}
#toast div.grand{font-family:var(--f-titre);font-size:6vh;color:#ff6a4a;letter-spacing:.02em}
@keyframes toast{0%{opacity:0;transform:translateY(10px) scale(.9)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* ---------- panneaux ---------- */
.voile{position:absolute;inset:0;background:#07040bcc;display:grid;place-items:center;z-index:20;padding:2vh max(16px,env(safe-area-inset-right,0px)) 2vh max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.parchemin{background:linear-gradient(#efd9ad,#dcbc88);color:var(--encre);border:3px solid #4a3020;box-shadow:inset 0 0 0 2px #b78f55,inset 0 0 40px #8a5a2a55,0 10px 40px #000;border-radius:6px}
.bois{background:linear-gradient(#4a3424,#2d1f16);border:3px solid #6e5236;box-shadow:inset 0 0 0 2px #1a110a,0 10px 40px #000;border-radius:8px}
.fermer{position:absolute;top:-2vh;right:-2vh;width:6vh;height:6vh;border-radius:50%;background:radial-gradient(#5a4a3a,#2a1d12);border:3px solid #c9a052;color:#f2cd78;font-size:3.6vh;font-weight:800;line-height:1;display:grid;place-items:center;padding:0;z-index:3}
.btn{padding:1vh 2.6vh;font-size:2.3vh;font-weight:800;border-radius:4px;border:2px solid #3a1a0a;color:#ffe8c0;background:linear-gradient(#c8432e,#7a1a10);box-shadow:inset 0 1px 0 #ffffff44}
.btn.or{color:#2a1608;background:linear-gradient(#ffe7a8,#cf9a3e);border-color:#6e4a1a}
.btn.gris{color:#e9e2d0;background:linear-gradient(#6a6070,#3a3240);border-color:#1a141e}
.btn:disabled{filter:grayscale(1);opacity:.55}

/* Inventaire */
#inv .cadreInv{position:relative;width:min(150vh,96vw);height:min(86vh,92vh);display:grid;grid-template-columns:minmax(0,40%) minmax(0,60%);gap:2vh;padding:2.4vh;box-sizing:border-box}
#inv h2,#marche h2{font-family:var(--f-titre);font-weight:800;font-size:4vh;margin:0 0 1vh;color:var(--encre)}
.equipement{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,auto);gap:1.2vh;justify-items:center;align-items:center;background:#00000014;border-radius:6px;padding:1.4vh}
.equipement .silhouette{grid-column:2;grid-row:1/4;width:100%;height:100%;min-height:20vh}
.equipement .silhouette{display:grid;place-items:center;overflow:hidden}
.equipement .silhouette canvas{width:100%;height:auto;max-width:26vh;max-height:100%;aspect-ratio:1;object-fit:contain;display:block;border-radius:6px}
.case{width:9vh;height:9vh;border-radius:6px;position:relative;background:linear-gradient(#5a4632,#3a2a1c);border:2px solid #2a1a0e;box-shadow:inset 0 0 8px #000a;display:grid;place-items:center;padding:0;overflow:hidden}
.case img{width:92%;height:92%;object-fit:contain;filter:drop-shadow(0 2px 2px #000a)}
.case .tier{position:absolute;left:2px;top:1px;font-family:var(--f-label);font-weight:800;font-size:1.6vh;color:#fff;text-shadow:0 0 3px #000}
.case .nb{position:absolute;right:3px;bottom:1px;font-family:var(--f-label);font-weight:800;font-size:1.7vh;color:#fff;text-shadow:0 0 3px #000}
.case .vide{font-family:var(--f-label);font-size:1.4vh;color:#c9b48a99;text-align:center;padding:2px}
.case.q1{box-shadow:inset 0 0 0 2px #9fd8ff,inset 0 0 8px #000a}.case.q2{box-shadow:inset 0 0 0 2px #7dff9b,inset 0 0 8px #000a}.case.q3{box-shadow:inset 0 0 0 2px #d58cff,inset 0 0 8px #000a}.case.q4{box-shadow:inset 0 0 0 2px #ffcf4a,inset 0 0 12px #ffcf4a88}
.case.choisi{outline:3px solid #fff;outline-offset:1px}
.stats{margin-top:1.4vh;display:grid;grid-template-columns:1fr 1fr;gap:.4vh 2vh;font-size:2vh}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed #8a6a4a66;padding:.3vh 0}
.stats b{font-family:var(--f-label);font-variant-numeric:tabular-nums}
.grilleSac{display:grid;grid-template-columns:repeat(auto-fill,minmax(9vh,1fr));gap:1vh;overflow:auto;align-content:start;padding:1vh;background:#00000014;border-radius:6px;min-height:0}
.colDroite{display:flex;flex-direction:column;min-height:0}
.colDroite .entete{display:flex;justify-content:space-between;align-items:baseline}

/* fiche d'objet */
#fiche{z-index:30}
.carteObjet{width:min(62vh,92vw);max-height:90vh;overflow:auto;padding:2.2vh;box-sizing:border-box;position:relative}
.carteObjet .tete{display:flex;gap:1.6vh;align-items:center}
.carteObjet .grosse{width:14vh;height:14vh;flex:none}
.carteObjet .titre{font-family:var(--f-label);font-weight:800;font-size:3vh;line-height:1.05;text-shadow:0 1px 0 #0006}
.carteObjet .sous{font-size:1.9vh;color:#5a3a1e;margin-top:.4vh}
.carteObjet .ip{display:inline-block;margin-top:.6vh;padding:.2vh 1vh;background:#3a2312;color:#ffd27a;border-radius:3px;font-family:var(--f-label);font-weight:800;font-size:1.9vh}
.carteObjet table{width:100%;border-collapse:collapse;margin-top:1.4vh;font-size:2.1vh}
.carteObjet td{padding:.5vh .4vh;border-bottom:1px solid #8a6a4a44}
.carteObjet td:nth-child(2){text-align:right;font-family:var(--f-label);font-weight:800;font-variant-numeric:tabular-nums}
.carteObjet td.diff{text-align:right;width:8vh;font-family:var(--f-label);font-weight:800}
.plus{color:#1f7a2a}.moins{color:#a51d16}
.sortsObj{margin-top:1.4vh;display:flex;flex-direction:column;gap:1vh}
.sortsObj .s{display:flex;gap:1.2vh;align-items:flex-start;font-size:1.9vh}
.sortsObj .s svg{width:5.4vh;height:5.4vh;flex:none;border-radius:50%;border:2px solid #6a5e72}
.sortsObj .s b{font-family:var(--f-label)}
.actions{display:flex;gap:1.2vh;justify-content:flex-end;margin-top:1.8vh;flex-wrap:wrap}

/* Marché */
#marche .cadreM{position:relative;width:min(140vh,96vw);height:min(88vh,92vh);display:flex;flex-direction:column;padding:1.6vh 2vh;box-sizing:border-box}
.mEntete{display:flex;align-items:center;gap:1.4vh}
.mEntete .embleme{width:8vh;height:8vh;border-radius:50%;background:radial-gradient(#4a8a2a,#1f3a12);border:3px solid #2a1a0a;display:grid;place-items:center;flex:none}
.mEntete .embleme svg{width:60%}
.mEntete input{flex:1;min-width:0;font:inherit;font-size:2.4vh;padding:.8vh 1.6vh;border-radius:3vh;border:2px solid #6e5232;background:#f6e6c4;color:var(--encre)}
.mEntete .solde{font-family:var(--f-label);font-weight:800;font-size:3.4vh;color:#fff;text-shadow:0 0 3px #000;display:flex;align-items:center;gap:.8vh}
.filtres{display:flex;gap:1.2vh;margin:1.2vh 0;flex-wrap:wrap}

.tailles{display:grid;grid-template-columns:1fr 1fr;gap:.8vh}
.taille{padding:.8vh;border-radius:4px;border:2px solid #6e5236;background:linear-gradient(#3a2a18,#22160c);color:#f2cd78;display:flex;flex-direction:column;align-items:center;gap:.2vh}
.taille b{font-size:1.8vh}.taille span{font-size:2.2vh;color:#fff;font-weight:800}.taille:disabled{opacity:.4}
.aideIle{font-size:1.8vh;color:#cdbb98;margin:.6vh 0}
.barreTroph.pille{background:#2a0e0a;border-color:#8a2a1a;margin-top:2vh}
.teteInt{display:flex;align-items:center;gap:1.6vh}.teteInt .visage{width:10vh;height:10vh;border-radius:50%;overflow:hidden;border:3px solid #c9a052;background:#2a1c0c}.teteInt .visage canvas{width:100%;height:100%}
.ongInt{margin:1.4vh 0;flex-wrap:wrap}
.corpsInt{color:#f2e6cc;font-size:2vh;line-height:1.4}
.regles ul{margin:.6vh 0;padding-left:2.4vh;display:flex;flex-direction:column;gap:.6vh}
.resL{display:flex;align-items:center;gap:1vh;padding:.8vh 0;border-bottom:1px solid #4a3a20;flex-wrap:wrap}.resL img{width:4.4vh;height:4.4vh}.resL b{font-size:2.6vh;color:#fff}.resL span{color:#bba;flex:1}
.mBarre.gros{height:3vh}.mBarre.gros span{line-height:3vh;font-size:1.8vh}
.gardeL{display:flex;align-items:center;gap:1.4vh;padding:1vh 1.2vh;margin:.6vh 0;border-radius:6px;background:#1a1206;border:2px solid #4a3a20}
.gardeL b{font-family:var(--f-label);font-size:2.2vh;color:#fff;min-width:16vh}.gardeL span{flex:1;color:#cdbb98}.gardeL em{color:#6aff7a;font-style:normal;font-weight:800}
.gardeL.champ{border-color:#ff8a3a}.gardeL.pris{opacity:.85;border-color:#3a7a2a}
.listeBat{display:flex;flex-direction:column;gap:.8vh;margin-top:1.4vh}
.batL{display:flex;align-items:center;gap:1.4vh;padding:.8vh 1.2vh;border-radius:6px;background:#1a1206;border:2px solid #4a3a20}
.batL img{width:7vh;height:7vh;object-fit:contain}.batL>div{flex:1;min-width:0;display:flex;flex-direction:column}.batL b{font-family:var(--f-label);font-size:2.2vh;color:#fff}.batL small{font-size:1.7vh;color:#cdbb98}.batL em{color:#6aff7a;font-style:normal;font-weight:800}
.batL.pris{opacity:.6}
.alerteRaid{display:flex;flex-direction:column;align-items:center;gap:1.6vh;text-align:center;max-width:110vh}
.alerteRaid h2{font-family:var(--f-titre);font-size:7vh;margin:0;color:#ff5a3a;text-shadow:0 0 30px #ff0000}
.alerteRaid p{font-size:2.6vh;color:#f0d8c8;margin:0}
.sirene{font-size:8vh;color:#ffcf3a;animation:pulse 0.8s infinite}

/* profil, code bêta */
.profil{display:flex;flex-direction:column;gap:1vh;padding:1vh .4vh;color:#3a2312;font-size:2vh}
.profil .ligneP{display:flex;justify-content:space-between;border-bottom:1px dashed #b89a6a;padding:.6vh 0}.profil .ligneP b{font-family:var(--f-label)}
.profil h3{margin:1.4vh 0 0;font-family:var(--f-titre);font-size:3.2vh;color:#5a1a6a}
.profil p{margin:0;font-size:1.8vh;color:#6a4a2e}
.codeL{display:flex;gap:1vh}.codeL input{flex:1;min-width:0;font:800 2.4vh var(--f-label);letter-spacing:.12em;padding:1vh 1.2vh;border-radius:4px;border:2px solid #8a6a3a;background:#fff8e6;color:#2a1608;text-transform:uppercase}
#codeMsg{min-height:2.6vh;font-weight:800}#codeMsg.ok{color:#6a1aa8}#codeMsg.ko{color:#a8221a}
.badgeBeta{align-self:flex-start;padding:.5vh 1.4vh;border-radius:20px;background:linear-gradient(90deg,#2a0a4a,#7a3aff);color:#f0e0ff;font-family:var(--f-label);font-weight:800;box-shadow:0 0 14px #9a5aff88}
.annonceRare{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:60;text-align:center;pointer-events:none;animation:rare 4.5s ease forwards}
.annonceRare h2{margin:0;font-family:var(--f-titre);font-size:7vh;color:#e8d0ff;text-shadow:0 0 30px #8a3aff,0 0 60px #4a0aaa}
.annonceRare p{margin:.6vh 0 0;font:800 2.6vh var(--f-label);color:#fff}
@keyframes rare{0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%) scale(1)}}

/* émoticônes */
.chatBtns{display:flex;gap:1vh;align-items:center}
#chat #btnEmote{padding:.3vh 1.6vh;font-size:2.8vh;line-height:1}
#emotes{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 7.5vh);transform:translateX(-50%);z-index:30;pointer-events:auto;display:grid;grid-template-columns:repeat(8,1fr);gap:.6vh;padding:1vh;border-radius:10px;background:linear-gradient(#2a2232f2,#14101af2);border:2px solid #7a7082;box-shadow:0 6px 24px #000a;width:min(92vh,62vw);box-sizing:border-box;animation:apparaitE .16s ease-out}
@keyframes apparaitE{0%{opacity:0;margin-bottom:-2vh}100%{opacity:1;margin-bottom:0}}
#emotes[hidden]{display:none}
#emotes button{display:flex;justify-content:center;flex-direction:column;align-items:center;gap:.2vh;padding:.6vh 0;border-radius:8px;background:#ffffff10;border:1px solid #ffffff22;color:#fff;font-size:4vh;line-height:1;min-height:7.4vh}
#emotes button b{font:900 3.2vh var(--f-label);line-height:4vh;text-shadow:0 2px 0 #000}
#emotes button small{font-size:1.4vh;color:#cfc4d8;font-weight:700}
#emotes button:active{transform:scale(.92);background:#ffffff26}
.emoteBulle{position:absolute;left:0;top:0;pointer-events:none;z-index:5}
.emoteBulle span{display:block;font-size:5vh;line-height:1;padding:.6vh .9vh;border-radius:2vh;background:#fffdf6;box-shadow:0 3px 0 #0005,0 0 0 2px #2a1a10;animation:popE .35s cubic-bezier(.3,1.8,.5,1),flotte 2.7s ease-in forwards;position:relative}
.emoteBulle span::after{content:"";position:absolute;left:50%;bottom:-1vh;transform:translateX(-50%);border:1vh solid transparent;border-top-color:#fffdf6;border-bottom:0}
.emoteBulle.txt span{font:900 3.6vh var(--f-titre);padding:.6vh 1.6vh;background:#1a1016;box-shadow:0 3px 0 #0008,0 0 0 2px currentColor;text-shadow:0 0 12px currentColor}
.emoteBulle.txt span::after{border-top-color:#1a1016}
@keyframes popE{0%{transform:scale(.55)}100%{transform:scale(1)}}
@keyframes flotte{0%,80%{opacity:1}100%{opacity:0;margin-top:-3vh}}
#perfHud{position:fixed;left:50%;top:.6vh;transform:translateX(-50%);z-index:80;pointer-events:none;font:700 1.7vh/1 monospace;color:#9effa0;background:#000a;padding:.5vh 1vh;border-radius:4px}

/* Sanctuaire d'Émeraude */
.carteSylve{position:relative;display:flex;align-items:center;gap:2vh;margin-top:1.6vh;padding:1.6vh 2vh;border-radius:8px;overflow:hidden;background:linear-gradient(120deg,#0a2a18,#123a22 50%,#0a2414);border:2px solid #3affa0;box-shadow:0 0 30px #3affa055,inset 0 0 40px #3affa022}
.carteSylve .feuilles{position:absolute;inset:0;background:radial-gradient(circle at 15% 30%,#5aff9a33,transparent 30%),radial-gradient(circle at 80% 70%,#c97aff22,transparent 35%);pointer-events:none}
.carteSylve .txtS{flex:1;position:relative}.carteSylve .niv{font:800 1.6vh var(--f-label);letter-spacing:.14em;color:#8affc0}
.carteSylve h3{margin:.2vh 0;font-family:var(--f-titre);font-size:3.6vh;color:#eaffd8;text-shadow:0 0 16px #3affa0}
.carteSylve p{margin:.4vh 0;font-size:1.8vh;color:#cfe8d8}.carteSylve .tiers{display:flex;gap:.8vh}.carteSylve .tiers span{padding:.2vh 1vh;border-radius:3px;font:800 1.6vh var(--f-label);color:#1a1008}
.btn.vert{background:linear-gradient(#6affb0,#1aa860);color:#032a14;border-color:#bfffd8;text-shadow:none;font-weight:900}
.btn.grand{padding:1.2vh 4vh;font-size:2.6vh;margin-top:1.4vh}
.cadreG,.cadreS{position:relative;width:min(150vh,94vw);max-height:92vh;overflow:auto;box-sizing:border-box;padding:2.4vh;border-radius:10px;background:radial-gradient(ellipse at top,#163a26,#07150d 75%);border:3px solid var(--c,#3affa0);box-shadow:0 0 70px #3affa055;color:#eaffe8;text-align:center}
.cadreG h2,.cadreS h2{margin:0;font-family:var(--f-titre);font-size:5vh;color:#eaffd8;text-shadow:0 0 22px var(--c,#3affa0)}
.cadreG .sous,.cadreS .sous{font-size:2vh;color:#a8d8b8;margin-bottom:1.6vh}
.slotsG{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2vh}
.slotG{min-height:20vh;border-radius:8px;border:2px dashed #3a6a4a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh;padding:1vh;background:#0a1e12}
.slotG.plein{border:2px solid var(--c);background:linear-gradient(#123a24,#0a1e12);animation:popE .4s cubic-bezier(.3,1.6,.5,1) backwards}
.slotG .icoC{width:7vh;height:7vh}.slotG b{font:800 2.2vh var(--f-label)}.slotG small{font-size:1.5vh;color:#7fb2ff}.slotG span{font:800 1.8vh var(--f-label);color:#ffd27a}
.slotG .cherche{width:5vh;height:5vh;border-radius:50%;border:4px solid #3affa044;border-top-color:#3affa0;animation:tourne 0.9s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.introBoss{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);z-index:55;text-align:center;pointer-events:none;animation:intro 3.6s ease forwards;width:90vw}
.introBoss h2{margin:0;font-family:var(--f-titre);font-size:8.5vh;color:#fff;text-shadow:0 0 24px var(--c),0 0 60px var(--c),0 4px 0 #000}
.introBoss p{margin:.4vh 0;font:800 2.8vh var(--f-label);letter-spacing:.2em;text-transform:uppercase;color:var(--c);text-shadow:0 2px 0 #000}
.introBoss .trait{height:3px;margin:1vh auto;width:60vh;background:linear-gradient(90deg,transparent,var(--c),transparent)}
@keyframes intro{0%{opacity:0;letter-spacing:.4em}12%{opacity:1;letter-spacing:normal}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
.enteteS{display:grid;grid-template-columns:30% 1fr 14%;gap:1vh;font:800 1.6vh var(--f-label);color:#7fb898;text-transform:uppercase;letter-spacing:.1em;padding:0 1vh 0 12vh;text-align:left}
.cadreS.final .enteteS{grid-template-columns:22% 1fr 11% 26%}
.tableauScores{display:flex;flex-direction:column;gap:.8vh}
.rangScore{display:grid;grid-template-columns:4vh 6vh 26% 1fr 14%;align-items:center;gap:1vh;padding:.8vh 1vh;border-radius:6px;background:#0d2216;border:1px solid #1e4a2e;text-align:left;animation:glisse .45s ease-out backwards}
.cadreS.final .rangScore{grid-template-columns:4vh 6vh 18% 1fr 11% 26%}
.rangScore.moi{border-color:#ffd27a;box-shadow:0 0 14px #ffd27a44 inset}
@keyframes glisse{0%{opacity:0;transform:translateX(-4vh)}100%{opacity:1;transform:none}}
.rangScore .rang{font:900 2.6vh var(--f-titre);color:#ffd27a;text-align:center}.rangScore .icoC{width:5.5vh;height:5.5vh}
.rangScore .nomS{display:flex;flex-direction:column;min-width:0}.rangScore .nomS b{font:800 2.2vh var(--f-label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rangScore .nomS small{font-size:1.5vh;color:#9ac8a8}
.barreS{position:relative;height:3.4vh;border-radius:4px;background:#051209;overflow:hidden;border:1px solid #1e3a26}
.barreS i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--c),#ffffffaa);opacity:.85;animation:remplit 1.1s cubic-bezier(.2,.8,.3,1) backwards;box-shadow:0 0 12px var(--c)}
@keyframes remplit{0%{width:0!important}}
.barreS span{position:relative;z-index:1;display:block;padding:0 1vh;font:900 2vh/3.4vh var(--f-label);color:#fff;text-shadow:0 1px 2px #000}
.rangScore .chiffres{display:flex;flex-direction:column;align-items:flex-end}.rangScore .chiffres b{font:800 2vh var(--f-label)}.rangScore .chiffres small{font-size:1.6vh;color:#9ac8a8}
.butinS{display:flex;align-items:center;gap:.5vh;flex-wrap:wrap}.butinS .mini .case{width:5vh;height:5vh}.butinS .arg,.butinBoss .arg{display:flex;align-items:center;gap:.4vh;font:800 1.8vh var(--f-label);color:#ffd27a}
.butinBoss{display:flex;align-items:center;justify-content:center;gap:1.4vh;margin-top:1.6vh;padding:1vh;border-radius:8px;background:#0a1e12;border:1px solid #2a5a3a}
.butinBoss .titreB{font:800 1.8vh var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:#8affc0}.butinBoss .case{width:8vh;height:8vh}
.cadreS.final .eclat{position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,#3affa022,transparent 20%,#3affa022 40%,transparent 60%);animation:tourne 18s linear infinite;pointer-events:none}

/* invasion, visée */
.alerteInv{position:fixed;inset:0;z-index:58;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:alerteI 4.2s ease forwards}
.alerteInv .voile{position:absolute;inset:0;background:radial-gradient(ellipse at center,#ff000000 25%,#ff0000aa 75%,#6a0000ee);animation:pulseR .55s ease-in-out 6 alternate}
.alerteInv h2{position:relative;margin:0;font-family:var(--f-titre);font-size:10vh;color:#fff;text-shadow:0 0 30px #ff0000,0 0 60px #ff0000,0 4px 0 #000}
.alerteInv p{position:relative;margin:.4vh 0;font:900 3.4vh var(--f-label);color:#ffd0c8;text-shadow:0 2px 0 #000;letter-spacing:.06em}
.alerteInv small{position:relative;font:700 2vh var(--f-label);color:#ffb0a0;text-shadow:0 2px 0 #000}
@keyframes pulseR{from{opacity:.55}to{opacity:1}}
@keyframes alerteI{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
#carteCadre.ping{animation:pingC 2.6s ease-out}
@keyframes pingC{0%,30%,60%{box-shadow:0 0 0 0 #ff2a2a,0 0 30px #ff0000}15%,45%{box-shadow:0 0 0 6px #ff2a2a88,0 0 40px #ff0000}100%{box-shadow:none}}
.sort.vise .cadre{box-shadow:0 0 0 3px #fff8,0 0 18px #fff6}
#vignetteVie{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .4s;will-change:opacity}
#vignetteVie::before,#vignetteVie::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,#ff000030 62%,#c00000b0 86%,#5a0000e0)}
#vignetteVie::after{background:radial-gradient(ellipse at center,transparent 35%,#ff1a1a55 70%,#ff0000aa);animation:battement 1.1s ease-in-out infinite;will-change:opacity}
@keyframes battement{0%,100%{opacity:0}12%{opacity:1}28%{opacity:.25}42%{opacity:.8}60%{opacity:0}}
.partage{margin:1.2vh 0 0;font:700 2vh var(--f-label);color:#cfe8d8}.partage b{color:#ffd27a}
.slotG em.trait{font-style:normal;font:800 1.6vh var(--f-label);padding:.2vh 1vh;border-radius:10px;background:#ffffff14;border:1px solid #ffffff2a;color:#eaffd8}

/* défilement des menus au doigt */
#portailMenu{overflow:hidden}
#portailMenu .cadreP{max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.cadreS,.cadreG,.carteObjet,.grilleSac,.lignes,.corpsInt,.listeR{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* losanges d'enchantement */
.case .ench{position:absolute;left:50%;bottom:.3vh;transform:translateX(-50%);display:flex;gap:.25vh;z-index:3}
.case .ench i{width:1.15vh;height:1.15vh;transform:rotate(45deg);background:linear-gradient(135deg,#bff0ff,#2a8aff);border:1px solid #062a5a;box-shadow:0 0 5px #4ab0ff}
/* arène létale */
.letale{display:flex;align-items:center;gap:2vh;margin-top:1.4vh;padding:1.4vh 2vh;border-radius:8px;background:linear-gradient(120deg,#3a0606,#1a0303);border:2px solid #ff3a2a;box-shadow:0 0 26px #ff2a1a55,inset 0 0 30px #ff2a1a22}
.letale .niv{font:800 1.6vh var(--f-label);letter-spacing:.14em;color:#ff8a6a}.letale h3{margin:.2vh 0;font-family:var(--f-titre);font-size:3.4vh;color:#ffe0d8;text-shadow:0 0 14px #ff2a1a}.letale p{margin:0;font-size:1.8vh;color:#f0c8c0}
.letale .boutonsL{display:flex;flex-direction:column;gap:1vh;flex:none}
.btn.rouge{background:linear-gradient(#ff5a4a,#a01a10);color:#fff;border-color:#ffb0a0}
.btn.bleu{background:linear-gradient(#7ac8ff,#1a5ac8);color:#fff;border-color:#c8ecff;text-shadow:0 1px 0 #0008}
/* fiche objet riche */
.carteObjet.riche{color:#2a1608;width:min(118vh,95vw);padding:0;background:linear-gradient(#f4e6c8,#e6d0a6);border:3px solid var(--tc);box-shadow:0 0 0 2px #2a1608,0 0 50px color-mix(in srgb,var(--tc) 60%,transparent);border-radius:10px;overflow:auto;max-height:94vh}
.riche .bandeau{display:flex;justify-content:space-between;align-items:center;padding:1vh 2.4vh;background:linear-gradient(90deg,var(--tc),color-mix(in srgb,var(--tc) 40%,#2a1608));color:#fff;font:900 2vh var(--f-label);letter-spacing:.14em;text-shadow:0 1px 2px #000a}
.riche .bandeau .qual{background:#1a0e06cc;padding:.3vh 1.2vh;border-radius:12px;letter-spacing:.04em}
.riche .corpsF{display:grid;grid-template-columns:30vh 1fr;gap:2.4vh;padding:2vh 2.4vh}
.riche .gaucheF{display:flex;flex-direction:column;align-items:center;gap:1.2vh}
.riche .vitrine{position:relative;width:26vh;height:26vh}
.riche .vitrine .halo{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 70%,transparent),transparent 65%);animation:pulseR 1.8s ease-in-out infinite alternate}
.riche .vitrine .case{position:relative;border-width:3px}
.riche .etoiles span{font-size:3vh;color:#b8a080;text-shadow:0 1px 0 #fff8}.riche .etoiles span.on{color:#ffb81a;text-shadow:0 0 8px #ffcf3a}
.enchF{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.7vh}
.enchF i{width:2vh;height:2vh;transform:rotate(45deg);background:#c8b898;border:1px solid #6a5a3a}
.enchF i.on{background:linear-gradient(135deg,#d0f4ff,#2a8aff);border-color:#06305a;box-shadow:0 0 8px #4ab0ff}
.enchF i.proch{animation:pulseR .6s infinite alternate;background:#9ad0ff66}
.enchF small{width:100%;text-align:center;font:700 1.6vh var(--f-label);color:#2a5a9a}
.riche .ipF{display:flex;flex-direction:column;align-items:center;padding:.6vh 2.4vh;border-radius:8px;background:#2a1608;color:#ffd27a}.riche .ipF small{font:800 1.4vh var(--f-label);letter-spacing:.14em;color:#c8a870}.riche .ipF b{font:900 4vh var(--f-titre)}
.riche .titre{font-family:var(--f-titre);font-size:4.4vh;line-height:1;color:color-mix(in srgb,var(--tc) 40%,#1a0e06)}
.riche .sous{font-size:2vh;color:#5a3a1e;margin:.4vh 0 1vh}
.statsF{display:flex;flex-direction:column;gap:.7vh;margin:1vh 0}
.statF{display:grid;grid-template-columns:20vh 1fr 11vh 9vh;align-items:center;gap:1vh;font-size:2vh}
.statF .lib{color:#4a2e16}.statF b{color:#2a1608;text-align:right;font:800 2.2vh var(--f-label);font-variant-numeric:tabular-nums}
.barreF{height:1.3vh;border-radius:1vh;background:#c8b08a;overflow:hidden}.barreF i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 60%,#3a2010),var(--tc));border-radius:1vh}
.statF .diff{font:800 1.7vh var(--f-label)}.statF .plus{color:#1a8a2a}.statF .moins{color:#c0281a}
.riche .sortsObj .s{color:#2a1608;font-size:1.9vh;background:#fff6e2aa;border-radius:8px;padding:.8vh}.riche .cdS{color:#6a4a2e;font-size:1.7vh}
.riche .compare,.riche .valeurF,.riche .descF{font-size:1.9vh;color:#5a3a1e;margin:.8vh 0 0}.riche .descF{font-size:2.2vh}
.riche .actions{padding:0 2.4vh 2vh;display:flex;gap:1.4vh;justify-content:flex-end}
.riche .req{font-weight:700}
/* graveuse de runes */
#portailMenu .cadreP.runes{background:radial-gradient(ellipse at top,#0e2244,#050a16 75%);border-color:#4a9aff;box-shadow:0 0 60px #3a8aff55}
#portailMenu .cadreP.runes h2{color:#cfe8ff;text-shadow:0 0 18px #3a8aff}
.runesCorps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:2vh;margin-top:1.4vh}
.listeR{align-content:start;grid-auto-rows:10vh;display:grid;grid-template-columns:repeat(auto-fill,minmax(10vh,1fr));gap:1vh;max-height:62vh;overflow:auto;padding:.4vh}
