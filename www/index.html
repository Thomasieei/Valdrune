<!DOCTYPE html>
<html lang="fr">
<head><link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Souverain des Ombres</title>
<style>
@font-face{font-family:'Grenze Gotisch';src:url(assets/fonts/grenze.woff) format('woff');font-weight:100 900;font-display:swap}
@font-face{font-family:'Alegreya Sans';src:url(assets/fonts/as700.woff) format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'Alegreya Sans';src:url(assets/fonts/as800.woff) format('woff');font-weight:800;font-display:swap}
@font-face{font-family:'Alegreya Sans SC';src:url(assets/fonts/sc800.woff) format('woff');font-weight:800;font-display:swap}
:root{--or:#ffd27a;--violet:#a879ff;--f-titre:'Grenze Gotisch',serif;--f-label:'Alegreya Sans SC',sans-serif;--f-texte:'Alegreya Sans',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0812;font-family:var(--f-texte);color:#f6eedd}
#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.verre{background:linear-gradient(#1e1830e6,#120e1ee6);border:1px solid #ffffff1f;border-radius:1.6vh;box-shadow:0 .6vh 2vh #0007}
/* haut gauche : le souverain */
#moi{position:absolute;left:calc(1.6vh + env(safe-area-inset-left));top:1.6vh;padding:1vh 1.4vh;min-width:26vh}
#moi h1{margin:0 0 .6vh;font:900 2.6vh var(--f-titre);color:var(--or);letter-spacing:.02em}
#pv{position:relative;height:2.4vh;border-radius:1.2vh;background:#16060a;overflow:hidden;border:1px solid #ff5a5a55;margin-bottom:.6vh}
#pv i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c0202a,#ff6a5a);transition:width .25s}
#pv b{position:absolute;inset:0;display:grid;place-items:center;font:800 1.5vh var(--f-label);text-shadow:0 1px 2px #000}
#endb{height:1vh;margin-top:.5vh;border-radius:.5vh;background:#06140a;overflow:hidden;border:1px solid #5aff8a44}#end{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2ab05a,#8aff9a);transition:width .1s}#endb.bas{animation:pulse .6s infinite;border-color:#ff5a5a}
#btnAttaque.charge .cadre{background:conic-gradient(from 0deg,#ffd27a,#fff,#ff8a2a,#fff,#ffd27a);box-shadow:0 0 3vh #ffb04a}
#xpb{height:.6vh;margin-top:.5vh;border-radius:.3vh;background:#ffffff14;overflow:hidden}#xp{display:block;height:100%;width:0;background:#ffd27a;transition:width .3s}
#moi h1 em{font:800 1.5vh var(--f-label);color:#ffd27a;font-style:normal}#moi h1 .pts{display:inline-block;padding:0 .7vh;border-radius:1vh;background:#ffd27a;color:#1a1008;font:900 1.4vh var(--f-label);animation:pulse 1.2s infinite}
#moi{cursor:pointer}
#mana{position:relative;height:2.4vh;border-radius:1.2vh;background:#0c0816;overflow:hidden;border:1px solid #a879ff55}
#mana i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#5a2aff,#b98aff);box-shadow:0 0 1.2vh #a879ff;transition:width .3s}
#mana b{position:absolute;inset:0;display:grid;place-items:center;font:800 1.5vh var(--f-label);text-shadow:0 1px 2px #000}
/* haut centre : la richesse du royaume */
#bois{position:absolute;left:50%;top:1.6vh;transform:translateX(-50%);padding:.8vh 2.2vh;display:flex;align-items:center;gap:1vh;font:800 2.8vh var(--f-label)}
#bois b{color:#ffe1a8;min-width:4ch;text-align:left}
#bois.pop{animation:pop .35s}
@keyframes pop{40%{transform:translateX(-50%) scale(1.18)}}
/* quête guidée */
#quete{position:absolute;left:calc(1.6vh + env(safe-area-inset-left));top:16.4vh;width:34vh;padding:1.1vh 1.4vh}
#quete b{display:block;font:800 1.9vh var(--f-label);color:var(--or);margin-bottom:.3vh}
#quete span{display:block;font-weight:700;font-size:1.75vh;line-height:1.3;color:#e8dcc8}
#quete i{display:block;height:.9vh;margin-top:.8vh;border-radius:.5vh;background:#0006;overflow:hidden}
#quete u{display:block;height:100%;background:linear-gradient(90deg,#c88a3a,#ffd27a)}
/* droite : ombres */
#btnOmbres{position:absolute;right:calc(1.6vh + env(safe-area-inset-right));top:1.6vh;display:flex;align-items:center;gap:1vh;padding:1vh 1.8vh;font:800 2.2vh var(--f-label);color:#e8d8ff;border:1px solid #a879ff66}
#btnOmbres small{display:grid;place-items:center;min-width:3.2vh;height:3.2vh;border-radius:1.6vh;background:#a879ff;color:#120a24;font-size:1.8vh}
#btnConstruire{position:absolute;right:calc(1.6vh + env(safe-area-inset-right));top:9.4vh;padding:1vh 1.8vh;font:800 2.1vh var(--f-label);color:#ffe1a8;border:1px solid #ffd27a55}
#placement[hidden]{display:none}
#combat{position:absolute;right:var(--decalSorts,16vw);bottom:0;width:60vh;height:50vh;pointer-events:none;z-index:6}
#combat button{position:absolute;transform:translate(50%,50%);border-radius:50%;padding:0;border:0;background:none;pointer-events:auto;touch-action:none}
#combat .cadre{position:absolute;inset:0;border-radius:50%;padding:.45vh;background:conic-gradient(from 200deg,#6a5e72,#cbc3d2,#5d5266,#a99fb2,#6a5e72);box-shadow:0 .6vh 1.6vh #000b}
#combat .cadre>div{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 40% 35%,#3a1a6a,#120a1e 75%)}
#combat svg{position:absolute;inset:16%;width:68%;height:68%}
#combat .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#000c calc(var(--cd,0)*360deg),transparent 0)}
#combat em{position:absolute;inset:0;display:grid;place-items:center;font:900 3.2vh var(--f-label);color:#fff;font-style:normal;text-shadow:0 1px 3px #000}
#combat small{position:absolute;left:50%;bottom:-2.1vh;transform:translateX(-50%);font:800 1.3vh var(--f-label);color:#e8dcff;white-space:nowrap;text-shadow:0 0 3px #000,0 0 3px #000}
#combat button:active,#combat .presse{scale:.92}
#btnAttaque{right:25.2vh;bottom:25.9vh;width:15vh;height:15vh}
#btnAttaque .cadre{padding:.7vh;background:conic-gradient(from 200deg,#7b7085,#e8e2ee,#6a5e72,#c3bacb,#7b7085)}
#btnAttaque .cadre>div{background:radial-gradient(circle at 40% 35%,#6a3aaa,#2a1250 70%)}
#pw-lame{right:40.5vh;bottom:19.4vh;width:9.4vh;height:9.4vh}
#pw-tele{right:40.5vh;bottom:32.9vh;width:9.4vh;height:9.4vh}
#pw-parade{right:27.5vh;bottom:41.7vh;width:9.4vh;height:9.4vh}
#pw-arise{right:13.6vh;bottom:38.9vh;width:9.4vh;height:9.4vh}
#pw-saut{right:27.5vh;bottom:10.6vh;width:9.4vh;height:9.4vh}
#pw-dash{right:13.6vh;bottom:13vh;width:9.4vh;height:9.4vh}
#combat .pret .cadre{background:conic-gradient(from 200deg,#8a6ac8,#f0e6ff,#6a4aa8,#c8a8ff,#8a6ac8)}
#pw-arise.dispo .cadre{background:conic-gradient(from 0deg,#ffd27a,#fff6d8,#c8902a,#ffd27a);animation:pulse 1s infinite}
#pw-parade.garde .cadre{background:conic-gradient(#b98aff,#fff,#b98aff);box-shadow:0 0 2.4vh #b98aff}
#action{bottom:34vh!important;right:calc(2.4vh + env(safe-area-inset-right))!important}
body.souverain #combat{display:none}
body.touche::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 12vh #ff1a2a99;animation:touche .5s forwards}
@keyframes touche{to{opacity:0}}
.vie{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:.3vh;pointer-events:none}
.vie small{font:800 1.65vh var(--f-label);color:#ffd8d0;text-shadow:0 1px 2px #000;white-space:nowrap}.vie small em{color:#ffd27a;font-style:normal}
.vie i{display:block;width:10.5vh;height:1.25vh;border-radius:.5vh;background:#1a0608;border:1px solid #0008;overflow:hidden}.vie u{display:block;height:100%;background:linear-gradient(90deg,#c0202a,#ff6a5a)}
.vie.allie small{color:#e0d0ff}.vie.allie u{background:linear-gradient(90deg,#5a2aff,#b98aff)}
.flot.degat{color:#fff;font-size:3.1vh;-webkit-text-stroke:.25vh #2a0a0a;paint-order:stroke fill}.flot.crit{color:#ffd23a;font-size:4.6vh;font-weight:900;-webkit-text-stroke:.3vh #5a1a00;paint-order:stroke fill;text-shadow:0 0 1.6vh #ff8a1a,0 2px 3px #000}
.pw-verrou{filter:grayscale(1) brightness(.55)}.pw-verrou::after{content:'🔒 ' attr(data-niv);position:absolute;left:50%;bottom:-.2vh;transform:translateX(-50%);font:800 1.3vh var(--f-label);color:#fff;white-space:nowrap;text-shadow:0 1px 2px #000}.flot.mal{color:#ff5a5a;font-size:2.6vh}.flot.alerte{color:#ff3a3a;font-size:4vh;font-weight:900}
.flot.xp{color:#ffd27a;font-size:1.9vh}.flot.info{color:#cdbfe6;font-size:1.9vh}.flot.parade{color:#fff;font-size:3.4vh;text-shadow:0 0 1.4vh #b98aff}
.flot.arise{font:900 4.6vh var(--f-titre);color:#d8c0ff;text-shadow:0 0 2vh #7a3aff,0 0 4vh #5a1aff}
.demolir{display:block;width:100%;margin-top:1.4vh;padding:1.2vh;border-radius:1.2vh;border:1px solid #ff6a5a55;background:#3a101088;color:#ffb0a8;font:800 1.7vh var(--f-label)}.demolir.sur{background:#a02020;color:#fff}
#pts{position:absolute;right:25.2vh;bottom:16.9vh;transform:translate(50%,50%);display:flex;gap:.7vh;pointer-events:none}
#pts i{width:1.6vh;height:1.6vh;transform:rotate(45deg);border:1.5px solid #c8a8ff88;background:#140a24;border-radius:.2vh;transition:.15s}
#pts i.on{background:linear-gradient(135deg,#fff,#b98aff);border-color:#fff;box-shadow:0 0 1vh #b98aff}
#pw-lame.charge .cadre{background:conic-gradient(from 0deg,#b98aff,#fff,#6a2aff,#fff,#b98aff);animation:pulse .9s infinite}
.vie s{display:block;position:relative;width:10vh;height:1.3vh;margin-top:.3vh;border-radius:.4vh;background:#1a0c04;border:1px solid #ffb04a88;overflow:hidden;text-decoration:none}
.vie s q{display:block;height:100%;width:0;background:linear-gradient(90deg,#c86a10,#ffd27a)}.vie s q::before,.vie s q::after{content:none}
.vie s span{position:absolute;inset:0;display:grid;place-items:center;font:800 1vh var(--f-label);color:#fff;text-shadow:0 1px 2px #000}
.vie .po{display:block;width:8vh;height:.5vh;margin-top:.2vh;border-radius:.3vh;background:#1a1408;overflow:hidden}.vie .po u{display:block;height:100%;width:0;background:linear-gradient(90deg,#c8902a,#ffe9a0)}
.vie.brise .po u{background:#fff;box-shadow:0 0 1vh #ffd27a}.vie.brise small{color:#ffd27a}
.vie .etourdi{display:none;margin-left:.4vh}.vie.etou .etourdi{display:inline}
.flot.alerte-sort{color:#ffb04a;font-size:2.2vh;font-weight:900;text-shadow:0 0 1vh #ff3a10,0 2px 3px #000}
#cibleUI{position:absolute;left:50%;top:9vh;transform:translate(-50%,-1vh);display:flex;align-items:center;gap:1vh;padding:.8vh 1.4vh .8vh .8vh;border-radius:5vh 1.6vh 1.6vh 5vh;background:linear-gradient(90deg,#1a0a12ee,#120a1ccc);border:1px solid #ff5a5a55;box-shadow:0 .6vh 2vh #0009;opacity:0;pointer-events:none;transition:.2s;z-index:5}
#cibleUI.on{opacity:1;transform:translate(-50%,0)}
#cibleUI .por{width:6.4vh;height:6.4vh;border-radius:50%;display:grid;place-items:center;font-size:3.8vh;background:radial-gradient(circle at 40% 35%,#5a2a2a,#1a0808);border:2px solid #ff6a5a99;box-shadow:0 0 1.4vh #ff3a3a55}
#cibleUI .inf{width:30vh;display:flex;flex-direction:column;gap:.4vh}
#cibleUI .nom{font:800 1.8vh var(--f-label);color:#ffd8d0}#cibleUI .nom em{color:#ffd27a;font-style:normal;margin-left:.4vh}
#cibleUI .pv,#cibleUI .mn,#cibleUI .po,#cibleUI .cs{position:relative;border-radius:.6vh;overflow:hidden;background:#0c0408}
#cibleUI .pv{height:2.2vh}#cibleUI .pv u{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#b0182a,#ff5a4a);transition:width .12s}
#cibleUI .pv b{position:absolute;inset:0;display:grid;place-items:center;font:800 1.4vh var(--f-label);color:#fff;text-shadow:0 1px 2px #000}
#cibleUI .mn{height:.9vh}#cibleUI .mn u{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2a5aff,#6ab0ff)}
#cibleUI .po{height:.7vh}#cibleUI .po u{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c8902a,#ffe9a0)}
#cibleUI.brise .po u{background:#fff;box-shadow:0 0 1vh #ffd27a}#cibleUI.brise .nom::after{content:' · BRISÉ';color:#ffd27a}
#cibleUI .cs{height:1.8vh;border:1px solid #ffb04a88}#cibleUI .cs u{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c86a10,#ffd27a)}#cibleUI .cs b{position:absolute;inset:0;display:grid;place-items:center;font:800 1.2vh var(--f-label);color:#fff;text-shadow:0 1px 2px #000}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 55%,transparent 55%,#05020c66 100%)}
.stats.suivant{color:#a8ffbf;opacity:.85}
#guide{position:fixed;left:0;top:0;z-index:15;font-size:6vh;pointer-events:none;opacity:0;margin:-.4vh 0 0 -2.2vh;filter:drop-shadow(0 .4vh .6vh #000a);transition:opacity .3s}
#guide.on{opacity:1;animation:tape 1s ease-in-out infinite}
@keyframes tape{0%,100%{translate:0 1.2vh}50%{translate:0 3.4vh}}
#retour{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#05020cb8}
#retour[hidden]{display:none}
#retour .boite{min-width:46vh;padding:3vh 4vh;border-radius:2.4vh;text-align:center;background:linear-gradient(#2a1650,#140a26);border:1px solid #c8a8ff55;box-shadow:0 0 6vh #7a3aff66;color:#f2eaff}
#retour h3{margin:0 0 1vh;font:900 4.4vh var(--f-titre);color:#ffd27a}
#retour p{margin:0 0 2vh;font:600 2.2vh var(--f-label)}

#retour small{display:block;font:600 1.7vh var(--f-label);color:#c8a8ffaa;margin-bottom:2vh}

#btnMode{position:absolute;z-index:6;left:calc(1.6vh + env(safe-area-inset-left));bottom:30vh;width:9vh;height:9vh;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:3.6vh;line-height:1;border:2px solid #c8a8ff66;color:#fff}
#btnMode small{font:800 1.2vh var(--f-label);margin-top:.4vh;color:#e8dcff}
body.souverain #btnMode{left:auto;right:calc(3vh + env(safe-area-inset-right));bottom:26vh;border-color:#ffd27a88}

body.souverain #scene{filter:saturate(1.08)}
#indice{position:absolute;left:50%;bottom:4vh;transform:translate(-50%,2vh);padding:1.2vh 2.6vh;border-radius:3vh;background:#120a22d8;border:1px solid #c8a8ff55;color:#f2eaff;font:800 2vh var(--f-label);opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#indice.on{opacity:1;transform:translate(-50%,0)}
#placement{position:absolute;right:calc(3vh + env(safe-area-inset-right));bottom:5vh;display:flex;gap:1.2vh;align-items:center}
#placement .verre{width:7vh;height:7vh;border-radius:50%;font:800 3vh var(--f-label);color:#fff}
#btnPoser{padding:2.2vh 3vh;border-radius:3vh;border:0;font:800 2.4vh var(--f-label);color:#0c2a14;background:linear-gradient(#a8ffbf,#3ccf6a);box-shadow:0 .8vh 0 #1a6a32,0 1.4vh 3vh #0008}
#btnPoser:disabled{color:#3a1010;background:linear-gradient(#ffb0a8,#d85a4a);box-shadow:0 .8vh 0 #6a1a14}
#bois .sep{display:inline-block;width:1px;height:2.4vh;background:#ffffff33;margin:0 .4vh}
.filtres{display:flex;gap:.8vh;overflow-x:auto;margin-bottom:1.2vh;scrollbar-width:none}
.filtres button{flex:none;padding:.8vh 1.6vh;border-radius:2vh;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font:800 1.8vh var(--f-label)}
.filtres button b{color:#ffd27a;margin-left:.3vh}.filtres button.on{background:#7a3aff55;border-color:#c8a8ff}
.pastilles{display:grid;grid-template-columns:repeat(3,1fr);gap:.8vh;margin-bottom:1.2vh}
.pastille{display:flex;flex-direction:column;align-items:center;gap:.2vh;padding:.9vh .4vh;border-radius:1.2vh;border:2px solid #ffffff14;background:#ffffff0a;color:#fff}

.onglets{display:flex;gap:1vh;margin-bottom:1.4vh}

.tuiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2vh}

.tuile i{font-style:normal;font-size:4.6vh;line-height:1}
.tuile b{font:800 1.9vh var(--f-label)}

.tuile .cout{font:800 1.7vh var(--f-label);color:#ffe1a8}.tuile .cout .manque{color:#ff8a7a}

.tuile.non{opacity:.6}.tuile.verrou{opacity:.38;filter:grayscale(.8);--c:#777}
.badge{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}

.carte .et{color:#ffd27a;letter-spacing:.1em}.carte .et i{color:#ffffff30;font-style:normal}
.carte.bat .ico{font-size:3vh}.carte.bat.non{opacity:.62}
.carte .cout{display:flex;align-items:center;gap:1.2vh;margin-top:.8vh;font:800 1.9vh var(--f-label);color:#ffe1a8}

.ordres button{display:flex;flex-direction:column;align-items:center;gap:.2vh;font-size:2.2vh!important;padding:.8vh 0!important}

.eti.chantier{color:#ffe1a8}
.eti.repousse{font-size:1.6vh;padding:.3vh 1vh;opacity:.85;color:#d8f5c0}
/* gros bouton d'action (zone du pouce droit) */
#action{position:absolute;z-index:6;right:calc(3vh + env(safe-area-inset-right));bottom:5vh;padding:2.2vh 3.4vh;border-radius:3vh;border:0;font:800 2.6vh var(--f-label);color:#1a1008;background:linear-gradient(#ffe2a0,#e0a948);box-shadow:0 .8vh 0 #8a5a1a,0 1.4vh 3vh #0008;letter-spacing:.03em}
#action.eveil{color:#fff;background:linear-gradient(#a879ff,#5a1fd6);box-shadow:0 .8vh 0 #2a0a6a,0 0 3vh #a879ffaa;animation:pulse 1.4s infinite}
#action:active{transform:translateY(.5vh);box-shadow:0 .3vh 0 #8a5a1a}
@keyframes pulse{50%{box-shadow:0 .8vh 0 #2a0a6a,0 0 5vh #c8a8ff}}
/* joystick */
#zoneJoy{position:absolute;left:0;bottom:0;width:42vw;height:62vh;touch-action:none}
#joy{position:absolute;left:calc(5vh + env(safe-area-inset-left));bottom:6vh;width:17vh;height:17vh;border-radius:50%;background:radial-gradient(#ffffff10,#ffffff06);border:2px solid #ffffff2a;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:7.4vh;height:7.4vh;margin:-3.7vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,#ffffff30);border:2px solid #fff5}
#joy.actif{position:fixed;bottom:auto}
/* étiquettes, bulles, textes flottants */
#bulles,#flots{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.eti{position:absolute;left:0;top:0;white-space:nowrap;font:800 1.7vh var(--f-label);color:#efe4ff;text-shadow:0 1px 3px #000,0 0 6px #000;display:flex;align-items:center;gap:.5vh}
.eti em{font-style:normal;color:#ffe1a8;font-size:1.5vh}
.eti.sel{color:#fff;filter:drop-shadow(0 0 6px #a879ff)}
.rg{display:inline-grid;place-items:center;min-width:2.4vh;height:2.4vh;padding:0 .4vh;border-radius:.6vh;background:var(--c);color:#100a18;font:800 1.5vh var(--f-label);box-shadow:0 0 1vh var(--c)}
.bulle{position:absolute;left:0;top:0;max-width:30vh;padding:.8vh 1.2vh;border-radius:1.2vh;background:#f6eedd;color:#1a1020;font-weight:800;font-size:1.7vh;box-shadow:0 .4vh 1.4vh #0008}
.flot{position:absolute;left:0;top:0;font:800 2.6vh var(--f-label);color:#fff;text-shadow:0 2px 3px #000,0 0 8px #000;white-space:nowrap}
.flot.bois{color:#ffe1a8}.flot.niveau{color:#e0c8ff;font-size:2.3vh}
/* panneau des ombres */
#panneau{position:fixed;right:0;top:0;bottom:0;width:min(46vh,92vw);padding:2vh 1.8vh calc(2vh + env(safe-area-inset-bottom));transform:translateX(105%);transition:transform .28s;display:flex;flex-direction:column;border-radius:2vh 0 0 2vh;z-index:5}
#panneau.on{transform:none}
#panneau h2{margin:0 0 1.2vh;font:900 3.2vh var(--f-titre);color:#d8c0ff}
#panneau .x{position:absolute;right:1.6vh;top:1.6vh;width:5vh;height:5vh;border-radius:50%;border:0;background:#ffffff18;color:#fff;font:800 2.6vh var(--f-label)}
#panneau .liste{overflow-y:auto;display:flex;flex-direction:column;gap:1.2vh;padding-right:.4vh}
.carte{padding:1.2vh 1.3vh;border-radius:1.4vh;background:#ffffff0c;border:1px solid #ffffff14}
.carte.sel{border-color:#a879ff;box-shadow:0 0 1.4vh #a879ff55}
.carte .tete{display:flex;align-items:center;gap:1vh}
.carte .tete b{font:800 2.3vh var(--f-label)}
.carte .tete small{margin-left:auto;font-weight:800;font-size:1.6vh;color:#cdbfe6}
.carte .stats{margin:.6vh 0;font-weight:700;font-size:1.6vh;color:#bfb2d6}
.maitrise{display:flex;align-items:center;gap:1vh;font-weight:800;font-size:1.6vh;color:#ffe1a8}
.maitrise i{flex:1;height:.9vh;border-radius:.5vh;background:#0006;overflow:hidden}.maitrise u{display:block;height:100%;background:linear-gradient(90deg,#c88a3a,#ffd27a)}
.ordres{display:flex;gap:.8vh;margin-top:1vh}
.ordres button{flex:1;padding:1.2vh 0;border-radius:1.2vh;border:1px solid #ffffff22;background:#ffffff10;color:#f0e6ff;font:800 1.8vh var(--f-label)}
.ordres button.on{background:linear-gradient(#a879ff,#6a2ae0);border-color:#c8a8ff;color:#fff}
.vide{font-weight:700;font-size:1.9vh;color:#cdbfe6;line-height:1.4}
/* révélation du rang, éveil */
#rangRevele{position:fixed;left:50%;top:24%;transform:translate(-50%,-20px);opacity:0;text-align:center;pointer-events:none;transition:all .4s;text-shadow:0 2px 6px #000}
#rangRevele.on{opacity:1;transform:translate(-50%,0)}
#rangRevele small{display:block;font:800 1.9vh var(--f-label);color:#cdbfe6;letter-spacing:.2em}
#rangRevele b{display:block;font:900 6vh var(--f-titre);color:#fff;line-height:1}
#rangRevele .rang{display:inline-block;margin:.8vh 0;padding:.4vh 1.6vh;border-radius:1vh;background:var(--c);color:#100a18;font:800 2.6vh var(--f-label);box-shadow:0 0 3vh var(--c)}
#rangRevele em{display:block;font-style:normal;font-weight:800;font-size:1.8vh;color:#efe4ff}
#eveil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(transparent 35%,#1a0838cc);opacity:0;transition:opacity .6s;display:grid;place-items:center}
#eveil::after{content:'ÉVEILLE-TOI';font:900 9vh var(--f-titre);color:#e8d8ff;letter-spacing:.06em;text-shadow:0 0 3vh #a879ff,0 0 7vh #5a1fd6;opacity:0;transform:scale(1.3);transition:all .7s .15s}
#eveil.on{opacity:1}#eveil.on::after{opacity:1;transform:none}
#toasts{position:fixed;left:50%;top:9vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.8vh;pointer-events:none}
.toast{padding:.9vh 2vh;border-radius:2vh;background:#120e1ee6;border:1px solid #ffd27a66;font:800 2vh var(--f-label);color:var(--or);animation:tst 2.6s forwards}
@keyframes tst{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
/* chargement */
#charge{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:radial-gradient(ellipse at 50% 60%,#3a1a6a,#0a0614 70%);transition:opacity .7s}
#charge.fini{opacity:0;pointer-events:none}
#charge h1{margin:0;font:900 11vh var(--f-titre);line-height:.9;text-align:center;background:linear-gradient(#fff3d6,#ffd27a 45%,#b98aff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 2vh #7a3affaa)}
#charge h1 small{display:block;font-size:4vh;letter-spacing:.3em;color:#cdbfe6;-webkit-text-fill-color:#cdbfe6}
#charge .barre{width:40vh;height:1.2vh;border-radius:.6vh;background:#ffffff14;overflow:hidden}
#charge .barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7a3aff,#ffd27a);transition:width .2s}
#charge .go{display:none;padding:2vh 5vh;border-radius:3vh;border:0;font:800 3vh var(--f-label);color:#fff;background:linear-gradient(#a879ff,#5a1fd6);box-shadow:0 0 4vh #a879ff99;animation:pulse 1.4s infinite}
#charge.pret .barre{display:none}#charge.pret .go{display:block}
#charge::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(2px 2px at 70% 20%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#c8a8ff,transparent),radial-gradient(1.5px 1.5px at 85% 70%,#fff5,transparent);opacity:.8}
#panneau .liste>p.info{font:600 1.7vh/1.35 var(--f-label);color:#e8dcc8;margin:.4vh 0 1vh}#panneau .liste h3{font:800 1.9vh var(--f-label);color:#ffe28a;margin:1.6vh 0 .7vh;letter-spacing:.05em}#panneau [data-vendre] p,#panneau [data-acheter] p{font:600 1.5vh var(--f-label)}
</style>
</head>
