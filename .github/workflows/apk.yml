name: APK Arise Ville
on:
  push:
    branches: [arise-v04]
  workflow_dispatch:
permissions:
  contents: write
env:
  GODOT_VERSION: 4.3
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Godot + modèles d'export
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri >/dev/null
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable && unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --headless --editor --quit || true
          F=$(ls ~/.config/godot/editor_settings-4*.tres | head -1)
          echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" >> "$F"
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$F"
      - name: Import
        run: godot --headless --path . --import || godot --headless --path . --editor --quit || true
      - name: Test de lancement
        run: |
          godot --headless --path . --quit-after 300 2>&1 | tee run.log || true
          if grep -E "SCRIPT ERROR|Parse Error" run.log; then exit 1; fi
      - name: Tour du jeu (captures)
        run: |
          timeout 520 xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 -- --pilote=tour --sans-sauvegarde > tour.log 2>&1 || true
          grep -E "CAPTURE|SCRIPT ERROR|TOUR|PILOTE|at: " tour.log | grep -v "mesh_get_surface" | head -80 || true
          mkdir -p shots && cp /tmp/caps_arise/*.png shots/ 2>/dev/null || true
          cp tour.log shots/
          cd shots && git init -q -b arise-shots && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "captures ${{ github.run_number }}" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" arise-shots
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/royaume.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: royaume
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: royaume2026
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.4.${{ github.run_number }}\"/" export_presets.cfg
          mkdir -p out && godot --headless --path . --export-release "Android" out/AriseVille.apk && test -s out/AriseVille.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: arise-ville-v0.4.${{ github.run_number }}
          name: Arise Ville v0.4.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: Arise Ville v0.4 — source reconstruite depuis l'APK du 19/11. Télécharge AriseVille.apk depuis ton téléphone.
          files: out/AriseVille.apk
