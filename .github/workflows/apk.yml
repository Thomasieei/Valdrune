name: APK UMBRA
on:
  push:
    branches: [umbra]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Construire l'APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: UMBRA-apk
          path: out/UMBRA.apk
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: umbra-v1.${{ github.run_number }}
          name: UMBRA v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: APK Android d'UMBRA — L'Ascension des Ombres. Télécharge UMBRA.apk depuis ton téléphone et installe-le.
          files: out/UMBRA.apk
