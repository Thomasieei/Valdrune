name: APK NOCTALIS
on:
  push:
    branches: [noctalis]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Construire l'APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NOCTALIS-apk
          path: out/NOCTALIS.apk
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: noctalis-v1.${{ github.run_number }}
          name: NOCTALIS v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: APK Android de NOCTALIS — L'Éveil des Ombres. Télécharge NOCTALIS.apk depuis ton téléphone et installe-le.
          files: out/NOCTALIS.apk
