name: APK Brèche Écarlate
on:
  push:
    branches: [breche-ecarlate]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Construire l'APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BrecheEcarlate-apk
          path: out/BrecheEcarlate.apk
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: breche-ecarlate-v1.${{ github.run_number }}
          name: Brèche Écarlate v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: APK Android de Brèche Écarlate. Télécharge BrecheEcarlate.apk depuis ton téléphone et installe-le.
          files: out/BrecheEcarlate.apk
