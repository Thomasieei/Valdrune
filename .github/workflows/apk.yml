name: APK FRACTURE
on:
  push:
    branches: [fracture]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Construire l'APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FRACTURE-apk
          path: out/FRACTURE.apk
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fracture-v0.${{ github.run_number }}
          name: FRACTURE Lame Zéro — proto combat v0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: APK Android de FRACTURE Lame Zéro (prototype combat). Télécharge FRACTURE.apk depuis ton téléphone et installe-le.
          files: out/FRACTURE.apk
