name: Albion Bot Lab APK
on:
  push:
    branches: [bot-albion]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk AlbionBotLab.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: bot-albion-v${{ github.run_number }}
          name: Albion Bot Lab v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: AlbionBotLab.apk
