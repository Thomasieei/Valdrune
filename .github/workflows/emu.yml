name: Test sur téléphone émulé
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GODOT_VERSION: 4.3
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Godot + export (arm64 + x86_64 pour l'émulateur)
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable && unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --headless --editor --quit || true
          F=$(ls ~/.config/godot/editor_settings-4*.tres | head -1)
          echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" >> "$F"
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$F"
          godot --headless --path . --import || true
          sed -i 's/^architectures\/x86_64=false/architectures\/x86_64=true/' export_presets.cfg
          mkdir -p out && GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$PWD/android/studio.keystore GODOT_ANDROID_KEYSTORE_RELEASE_USER=royaume GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=royaume2026 godot --headless --path . --export-release "Android" out/test.apk && test -s out/test.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Téléphone émulé (Pixel 6, Android 11)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/emu_test.sh
      - name: Publier les captures
        if: always()
        run: |
          cd emu && git init -q -b studio-emu && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "emu ${{ github.run_number }}" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" studio-emu
