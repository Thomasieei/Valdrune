name: rooms
on: { push: { branches: [rooms-preview] } }
permissions: { contents: write }
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri >/dev/null
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip && sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --path . --import || true
          xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 2>&1 | grep -E "ROOM|ERROR" || true
          cd out && git init -q -b rooms-out && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm r && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" rooms-out
