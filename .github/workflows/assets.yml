name: Assets pipeline
on:
  push:
    branches: [assets-pipeline]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: assets-src, path: srcrepo }
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unrar 7zip libxi6 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null || sudo apt-get install -y -qq p7zip-full libxi6 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null
          pip install -q pillow
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar xf blender-4.2.3-linux-x64.tar.xz && sudo ln -s $PWD/blender-4.2.3-linux-x64/blender /usr/local/bin/blender
          blender -b --version | head -1
      - name: Traitement
        env:
          ONLY: "env_room99 env_simple env_throne env_dungeon1 env_office env_temple env_abbuilding env_brick env_modular pistol"
        run: ./run.sh srcrepo/src work out
      - name: Publier sur la branche assets-opt (fusion)
        run: |
          git clone -q --depth 1 -b assets-opt "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" prev
          python3 - <<'PY'
          import json, shutil, os, glob
          new = [json.loads(l) for l in open('out/report.jsonl') if l.strip()]
          ids = {r['id'] for r in new}
          old = [json.loads(l) for l in open('prev/report.jsonl') if l.strip()]
          merged = [next((n for n in new if n['id'] == r['id']), r) for r in old] + [n for n in new if n['id'] not in {r['id'] for r in old}]
          for f in glob.glob('out/*'):
              if not f.endswith('report.jsonl'): shutil.copy(f, 'prev/')
          open('prev/report.jsonl', 'w').write(''.join(json.dumps(r) + '\n' for r in merged))
          PY
          python3 sheet.py prev
          cd prev && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "Assets optimisés ${{ github.run_number }}" && git push -q
