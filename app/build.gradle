plugins { id 'com.android.application' }
android {
    namespace 'com.thomas.botlab'
    compileSdk 34
    defaultConfig {
        applicationId "com.thomas.botlab"
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        ndk { abiFilters 'arm64-v8a' }
    }
    androidResources { noCompress 'onnx' }
    signingConfigs {
        botlab {
            storeFile file("botlab.jks")
            storePassword "botlab123"
            keyAlias "botlab"
            keyPassword "botlab123"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.botlab }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
}
